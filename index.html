<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>游戏室</title>
  <style>
    :root{color-scheme:dark;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#e6e4de;background:#121719}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#27333666,transparent 60%),#121719}
    main{max-width:920px;margin:auto;padding:72px 28px}h1{margin:0;font-size:34px;font-weight:500;letter-spacing:4px}
    .intro{color:#acb5b1;line-height:1.8;margin:16px 0 38px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:20px}
    .game{display:flex;flex-direction:column;min-height:225px;padding:28px;color:inherit;text-decoration:none;border:1px solid #485452;border-radius:8px;background:#1d2729;transition:background .18s,border-color .18s,transform .18s}
    .game:hover{background:#263337;border-color:#d7b57b;transform:translateY(-3px)}.game:focus-visible{outline:3px solid #d7b57b;outline-offset:5px}
    .category{color:#d7b57b;font-size:13px;letter-spacing:3px}h2{font-size:25px;font-weight:500;margin:17px 0 12px}.description{margin:0 0 28px;color:#b8c1bc;font-size:15px;line-height:1.8}
    .enter{margin-top:auto;color:#e3c795;font-size:15px}@media(max-width:600px){main{padding:42px 20px}h1{font-size:29px}.game{padding:24px}}
    @media(prefers-reduced-motion:reduce){.game{transition:none}.game:hover{transform:none}}
  </style>
</head>
<body>
  <main>
    <h1>游戏室</h1>
    <p class="intro">选择一个故事，开始游玩。</p>
    <div class="games">
      <!-- 新游戏：复制下面这一整段链接，修改文件名、标题与简介。 -->
      <a class="game" href="seventh-prophecy.html">
        <span class="category">悬疑 · 推理</span>
        <h2>第七个预言</h2>
        <p class="description">雨夜，602室。一份预言，一间封闭的房间。走进现场，听完每个人的说法。</p>
        <span class="enter">开始调查 →</span>
      </a>
    </div>
  </main>
</body>
</html>
