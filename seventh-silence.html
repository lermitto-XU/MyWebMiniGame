'use strict';
function dialogueData(lines){return lines.map(([speaker,text])=>({speaker:speaker==='我'?'调查员':speaker,text}));}
// A single catalog owns each room's presentation, dialogue and investigation items.
const SCENES=Object.fromEntries(Object.entries(ROOMS).map(([id,room])=>[id,{
 id,name:room.name,min:room.min,...SCENE_VISUALS[id],
 dialogues:[{speaker:'调查员',text:room.intro},{speaker:'调查员',text:SCENE_VISUALS[id].line}],
 items:ACTIONS.filter(a=>a.room===id).map(a=>({...a,dialogues:dialogueData(a.lines)}))
}]));

function queueDialogue(lines,actionId=null){state.dialogue={lines,index:0,actionId};save();}
function playingDialogue(){return state.view==='scene'&&state.dialogue&&state.dialogue.index<state.dialogue.lines.length;}
function playInvestigation(id){const item=SCENES[state.room].items.find(a=>a.id===id);if(!available(item)||playingDialogue())return false;queueDialogue(item.dialogues,id);render();return true;}
function nextDialogue(){if(!playingDialogue())return false;const session=state.dialogue;session.index++;if(session.index>=session.lines.length){state.dialogue=null;if(session.actionId)performAction(session.actionId);save();const box=$('#galDialogue');if(box){box.classList.add('dialogue-leaving');box.disabled=true;}setTimeout(()=>{if(!state.dialogue&&state.view==='scene')render();},180);}else{save();paintDialogue();}return true;}
function paintDialogue(){const box=$('#galDialogue');if(!box||!playingDialogue())return;const d=state.dialogue.lines[state.dialogue.index];$('#dialogueSpeaker').textContent=d.speaker;$('#dialogueText').textContent=d.text;$('#dialogueCount').textContent=(state.dialogue.index+1)+' / '+state.dialogue.lines.length;box.setAttribute('aria-label',d.speaker+'：'+d.text+'。点击继续');}
function dialogueHTML(){return playingDialogue()?'<button type="button" class="gal-dialogue" id="galDialogue"><span class="gal-speaker" id="dialogueSpeaker"></span><span class="gal-text" id="dialogueText" aria-live="polite"></span><span class="gal-footer"><span id="dialogueCount"></span><span>点击 / 空格 / 回车继续 <span class="gal-arrow" aria-hidden="true">▼</span></span></span></button>':'';}

const SAVE_KEY='seventh-silence-offline-v1';
function blankState(){return{started:false,chapter:1,room:'door',view:'scene',found:[],flags:[],threads:[],done:[],feed:[],history:[],hints:{},notes:'',end:false,experimentResults:{},report:{},timeline:['play','relief','hurt','report','fetch','light','enter'],timelineOK:false,audio:false,volume:18,dialogue:null};}
let state=blankState();
function readSavedState(s){
 if(!s||typeof s!=='object'||s.chapter<1||s.chapter>4||!Number.isInteger(s.chapter)||!ROOMS[s.room]||ROOMS[s.room].min>s.chapter||!['scene','notebook','experiments','reconstruction'].includes(s.view))return null;
 const validArrays={found:Object.keys(EVIDENCE),done:ACTIONS.map(a=>a.id),threads:THREADS.map(t=>t.id)};
 for(const [key,allowed] of Object.entries(validArrays))if(!Array.isArray(s[key])||s[key].some(id=>!allowed.includes(id)))return null;
 if(!Array.isArray(s.flags)||s.flags.some(x=>typeof x!=='string')||!Array.isArray(s.timeline)||s.timeline.length!==TIMELINE.length||new Set(s.timeline).size!==TIMELINE.length||s.timeline.some(id=>!TIMELINE.some(t=>t.id===id)))return null;
 const validLines=lines=>Array.isArray(lines)&&lines.length<=40&&lines.every(line=>Array.isArray(line)&&line.length===2&&line.every(x=>typeof x==='string'));
 if(!validLines(s.feed)||!Array.isArray(s.history)||s.history.some(h=>!h||!ROOMS[h.room]||!validLines(h.lines))||typeof s.notes!=='string'||s.notes.length>100000)return null;
 if(!s.report||typeof s.report!=='object'||Array.isArray(s.report))return null;
 for(const [id,p] of Object.entries(s.report)){const c=CONCLUSIONS.find(c=>c.id===id);if(!c||!p||p.answer!==c.answer||!Array.isArray(p.proof)||p.proof.length>3||p.proof.some(x=>!s.found.includes(x))||!c.sets.some(set=>set.every(x=>p.proof.includes(x))))return null;}
 if(typeof s.started!=='boolean'||typeof s.end!=='boolean'||!s.hints||typeof s.hints!=='object'||Array.isArray(s.hints)||Object.values(s.hints).some(n=>!Number.isInteger(n)||n<0||n>3)||!s.experimentResults||typeof s.experimentResults!=='object'||Object.values(s.experimentResults).some(x=>typeof x!=='string'))return null;
 if(!Number.isFinite(s.volume)||s.volume<0||s.volume>50)return null;
 if(s.timelineOK&&!s.timeline.every((id,i)=>id===TIMELINE[i].id))return null;
 if(s.end&&(!s.timelineOK||CONCLUSIONS.some(c=>!s.report[c.id])))return null;
 if(s.dialogue!=null){const d=s.dialogue;if(!d||!Array.isArray(d.lines)||!d.lines.length||d.lines.length>40||d.lines.some(l=>!l||typeof l.speaker!=='string'||typeof l.text!=='string')||!Number.isInteger(d.index)||d.index<0||d.index>=d.lines.length||(d.actionId!=null&&!ACTIONS.some(a=>a.id===d.actionId&&a.room===s.room&&(a.min||1)<=s.chapter)))return null;}return {...blankState(),...s,audio:false};
}

const $=s=>document.querySelector(s);

let activeNotebook=null,feedback='',revisit=false;
function has(id){return state.found.includes(id)||state.flags.includes(id)||state.threads.includes(id);}
function remember(id){if(!(id in EVIDENCE))throw Error('Unknown note');if(!state.found.includes(id))state.found.push(id);}

function available(a){return a&&(a.min||1)<=state.chapter&&ROOMS[a.room].min<=state.chapter&&(!a.requires||a.requires.every(has));}
function performAction(id){const a=ACTIONS.find(a=>a.id===id);if(!state.started||!available(a)||a.room!==state.room)return{ok:false,message:'现在不能进行这项调查。'};if(state.done.includes(id)){archiveHistory(a.lines);save();return{ok:true,repeated:true};}a.give.forEach(remember);if(a.flag)flag(a.flag);state.done.push(id);archiveHistory(a.lines);if(a.sfx)ambient.cue(a.sfx);else if(id==='bolt')ambient.cue('latch');else if(id==='receiver')ambient.cue('tape');else if(a.give.length)ambient.cue('paper');feedback=a.give.length?'我把这次看到和听到的内容记进了笔记。':'';save();return{ok:true,notes:a.give};}
function moveTo(room){if(!ROOMS[room]||ROOMS[room].min>state.chapter)return false;state.room=room;state.view='scene';revisit=false;feedback='';archiveHistory(SCENES[room].dialogues.map(d=>[d.speaker==='调查员'?'我':d.speaker,d.text]));queueDialogue(SCENES[room].dialogues);save();render();ambient.update();return true;}
function start(){state.started=true;state.room='door';state.view='scene';archiveHistory(CHAPTERS[0].intro);queueDialogue(dialogueData(CHAPTERS[0].intro));save();render();$('#surface').scrollIntoView({block:'start'});}
function chapterReady(){return CHAPTERS[state.chapter-1].need.every(has);}
function advance(){if(state.chapter>=4||!chapterReady())return false;state.chapter++;state.view='scene';state.room=state.chapter===4?'cheng':'chen';archiveHistory(CHAPTERS[state.chapter-1].intro);queueDialogue(dialogueData(CHAPTERS[state.chapter-1].intro));feedback='';save();render();ambient.update();window.scrollTo({top:0,behavior:'smooth'});return true;}
function linkNotes(a,b,relation){if(a===b||!state.found.includes(a)||!state.found.includes(b))return{ok:false,message:'我得选两份不同的已有记录。'};const t=THREADS.find(t=>(t.min||1)<=state.chapter&&t.pairs.some(pair=>pair.includes(a)&&pair.includes(b)));if(!t)return{ok:false,message:'我把两份记录并排放下。暂时还接不起来；先回到它们各自描述的事情。'};if(t.relation!==relation)return{ok:false,message:'这两份记录值得放在一起，但我选的联系不合适。再看它们的时间、位置，或谁说了什么。'};if(!state.threads.includes(t.id)){state.threads.push(t.id);archiveHistory(t.result);}save();return{ok:true,thread:t.id,lines:t.result};}

function chapterTasks(){return CHAPTERS[state.chapter-1].need.map(id=>({id,title:THREADS.find(t=>t.id===id)?.title||({doors:'封闭房间是否只有一条通路？',tapeMatch:'23:53音轨与哪份材料相同？',clockFeed:'节目时码是否等于实时钟？',lightOnce:'额外短闪从哪条线路来？',weaponTest:'台面物件是否与伤害相接？'})[id],done:has(id)}));}
function taskBoard(){const tasks=chapterTasks();if(!tasks.length)return '';const left=tasks.filter(t=>!t.done);return `<section class="task-board" aria-label="本幕待解疑点"><div class="task-heading"><strong>本幕疑点</strong><span>已厘清 ${tasks.length-left.length} / ${tasks.length}</span></div><p>${left.length?'还有 '+left.length+' 个疑点需要厘清，才能继续调查。':'本幕疑点已厘清，可以继续调查。'}</p><ol>${tasks.map(t=>`<li class="${t.done?'task-done':'task-pending'}"><span>${t.done?'✓ 已厘清':'待厘清'}</span>${t.title}</li>`).join('')}</ol></section>`;}

function validateConclusion(id,answer,proof){const c=CONCLUSIONS.find(c=>c.id===id);if(state.chapter!==4||!c||!Array.isArray(proof)||proof.some(p=>!state.found.includes(p)))return{ok:false,message:'先完成现场调查，再提交已有记录。'};if(proof.length>3)return{ok:false,message:'老黄：“只留最直接的三份。你是在说明联系，不是在把整本笔记交给我。”'};if(answer!==c.answer||!c.sets.some(set=>set.every(p=>proof.includes(p))))return{ok:false,message:c.feedback};state.report[id]={answer,proof};save();return{ok:true,message:'这一段记录已经接上。'};}

function bindTimeline(){document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.order.split(',').map(Number);swapOrder(i,d);});let dragId=null;document.querySelectorAll('[data-event]').forEach(li=>{li.ondragstart=e=>{dragId=li.dataset.event;e.dataTransfer.setData('text/plain',dragId);};li.ondragover=e=>e.preventDefault();li.ondrop=e=>{e.preventDefault();const from=state.timeline.indexOf(dragId||e.dataTransfer.getData('text/plain')),to=state.timeline.indexOf(li.dataset.event);if(from<0||to<0)return;const[x]=state.timeline.splice(from,1);state.timeline.splice(to,0,x);state.timelineOK=false;save();$('#eventOrder').innerHTML=timelineHTML();bindTimeline();};});}
function renderReconstruction(){if(state.chapter<4){$('#surface').innerHTML='<span class="eyebrow">案件还原</span><h2>我还没有看见完整的一晚。</h2><div class="story"><p>先把现场、人物和实验核对完，再到第四幕与郑守核查。现在就填结论，只会把猜测写成事实。</p></div>';return;}
$('#surface').innerHTML=`<span class="eyebrow">案件还原 / 提交给老黄</span><h2>从顾霜接班开始。</h2><p class="muted">排列事件，再为每一段解释附上最直接的两至三份记录。拖动事件或用箭头调整顺序。</p><section class="reconstruction"><h3>案发夜的先后</h3><ol id="eventOrder" class="event-order">${timelineHTML()}</ol><button id="verifyOrder">核对事件顺序</button><p class="feedback" id="orderResult" role="status">${state.timelineOK?'顺序已核对。':''}</p></section>${CONCLUSIONS.map(c=>`<section class="reconstruction"><h3>${c.label}</h3>${state.report[c.id]?`<p class="accepted">${escapeHTML(state.report[c.id].answer)}</p><p class="muted">${state.report[c.id].proof.map(id=>EVIDENCE[id][0]).join(' · ')}</p><button class="text-button" data-edit="${c.id}">重新整理这一段</button>`:`<form data-report="${c.id}"><label class="report-answer">我的解释<select name="answer">${c.options.map(x=>`<option>${escapeHTML(x)}</option>`).join('')}</select></label><details class="proof-details"><summary>附上最直接的记录（最多三份）</summary><div class="proof-list">${state.found.map(id=>`<label><input type="checkbox" name="proof" value="${id}">${EVIDENCE[id][0]}</label>`).join('')}</div></details><button>把这一段交给老黄</button><p class="feedback" role="status"></p></form>`}</section>`).join('')}<button id="finishCase" class="primary">提交完整还原</button><p id="finishResult" class="feedback" role="status"></p>`;bindTimeline();$('#verifyOrder').onclick=()=>{$('#orderResult').textContent=validateTimeline(state.timeline).message;};document.querySelectorAll('[data-report]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const r=validateConclusion(f.dataset.report,fd.get('answer'),fd.getAll('proof'));if(r.ok){const y=window.scrollY;render();window.scrollTo({top:y});}else f.querySelector('.feedback').textContent=r.message;});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{delete state.report[b.dataset.edit];save();render();});$('#finishCase').onclick=()=>{const r=finish();if(!r.ok)$('#finishResult').textContent=r.message;};}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadSave(){download('第七次没有回答_进度.json',JSON.stringify({version:CASE_VERSION,state},null,2),'application/json');}
async function loadSave(e){const file=e.target.files?.[0];if(!file)return;try{const saved=JSON.parse(await file.text());const next=saved.version===CASE_VERSION?readSavedState(saved.state):null;if(!next)throw Error();ambient.disable();state=next;save();render();}catch(err){$('#hintResult').textContent='这不是有效的进度文件。当前调查没有被覆盖。';}}
function exportReport(){download('第七次没有回答_调查报告.txt','第七次没有回答 · 调查报告\n\n'+state.timeline.map(id=>{const t=TIMELINE.find(t=>t.id===id);return t.time+' '+t.text;}).join('\n')+'\n\n'+CONCLUSIONS.map(c=>c.label+'：'+state.report[c.id].answer+'\n依据：'+state.report[c.id].proof.map(id=>EVIDENCE[id][0]).join('、')).join('\n\n')+'\n\n我的备忘\n'+state.notes);}
$('#soundBtn').onclick=async()=>{if(state.audio)ambient.disable();else await ambient.enable();render();};$('#volume').oninput=e=>{state.volume=Number(e.target.value);ambient.update();save();};$('#closeModal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)ambient.pause();else ambient.resume().catch(()=>{});});
// Restored sessions require a new gesture before browser audio can play.
state.audio=false;
render();
</script></body></html>
