function dialogueData(lines){return lines.map(([speaker,text])=>({speaker:speaker==='我'?'侦探':speaker,text}));}
// A single catalog owns each room's presentation, dialogue and investigation items.
const SCENES=Object.fromEntries(Object.entries(ROOMS).map(([id,room])=>[id,{
 id,name:room.name,min:room.min,...SCENE_VISUALS[id],
 dialogues:[{speaker:'侦探',text:room.intro},{speaker:'侦探',text:SCENE_VISUALS[id].line}],
 items:ACTIONS.filter(a=>a.room===id).map(a=>({...a,dialogues:dialogueData(a.lines)}))
}]));

function queueDialogue(lines,actionId=null){state.dialogue={lines,index:0,actionId};save();}
function playingDialogue(){return state.view==='scene'&&state.dialogue&&state.dialogue.index<state.dialogue.lines.length;}
function playInvestigation(id){const item=SCENES[state.room].items.find(a=>a.id===id);if(!available(item)||playingDialogue())return false;queueDialogue(item.dialogues,id);render();return true;}
function nextDialogue(){if(!playingDialogue())return false;const session=state.dialogue;session.index++;if(session.index>=session.lines.length){state.dialogue=null;if(session.actionId)performAction(session.actionId);save();const box=$('#galDialogue');if(box){box.classList.add('dialogue-leaving');box.disabled=true;}setTimeout(()=>{if(!state.dialogue&&state.view==='scene')render();},180);}else{save();paintDialogue();}return true;}
function paintDialogue(){const box=$('#galDialogue');if(!box||!playingDialogue())return;const d=state.dialogue.lines[state.dialogue.index];$('#dialogueSpeaker').textContent=d.speaker;$('#dialogueText').textContent=d.text;$('#dialogueCount').textContent=(state.dialogue.index+1)+' / '+state.dialogue.lines.length;box.setAttribute('aria-label',d.speaker+'：'+d.text+'。点击继续');}
function dialogueHTML(){return playingDialogue()?'<button type="button" class="gal-dialogue" id="galDialogue"><span class="gal-speaker" id="dialogueSpeaker"></span><span class="gal-text" id="dialogueText" aria-live="polite"></span><span class="gal-footer"><span id="dialogueCount"></span><span>点击 / 空格 / 回车继续 <span class="gal-arrow" aria-hidden="true">▼</span></span></span></button>':'';}
function bindDialogue(){if(!playingDialogue())return;paintDialogue();$('#galDialogue').onclick=nextDialogue;}
document.addEventListener('keydown',e=>{if(!playingDialogue()||e.repeat||![' ','Enter'].includes(e.key))return;const tag=e.target?.tagName;if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(tag)||$('#modal').open)return;e.preventDefault();nextDialogue();});

const SAVE_KEY='seventh-prophecy-archive-v3';

let state=blankState();
function readLegacyState(s){
 if(!s||typeof s!=='object'||s.chapter<1||s.chapter>4||!Number.isInteger(s.chapter)||!ROOMS[s.room]||ROOMS[s.room].min>s.chapter||!['scene','notebook','experiments','reconstruction'].includes(s.view))return null;
 const validArrays={found:Object.keys(EVIDENCE),done:ACTIONS.map(a=>a.id),threads:THREADS.map(t=>t.id)};
 for(const [key,allowed] of Object.entries(validArrays))if(!Array.isArray(s[key])||s[key].some(id=>!allowed.includes(id)))return null;
 if(!Array.isArray(s.flags)||s.flags.some(x=>typeof x!=='string')||!Array.isArray(s.timeline)||s.timeline.length!==TIMELINE.length||new Set(s.timeline).size!==TIMELINE.length||s.timeline.some(id=>!TIMELINE.some(t=>t.id===id)))return null;
 const validLines=lines=>Array.isArray(lines)&&lines.length<=40&&lines.every(line=>Array.isArray(line)&&line.length===2&&line.every(x=>typeof x==='string'));
 if(!validLines(s.feed)||!Array.isArray(s.history)||s.history.some(h=>!h||!ROOMS[h.room]||!validLines(h.lines))||typeof s.notes!=='string'||s.notes.length>100000)return null;
 if(!s.report||typeof s.report!=='object'||Array.isArray(s.report))return null;
 for(const [id,p] of Object.entries(s.report)){const c=CONCLUSIONS.find(c=>c.id===id);if(!c||!p||p.answer!==c.answer||!Array.isArray(p.proof)||p.proof.length>3||p.proof.some(x=>!s.found.includes(x))||!c.sets.some(set=>set.every(x=>p.proof.includes(x))))return null;}
 if(typeof s.started!=='boolean'||typeof s.end!=='boolean'||!s.hints||typeof s.hints!=='object'||Array.isArray(s.hints)||Object.values(s.hints).some(n=>!Number.isInteger(n)||n<0||n>3)||!s.experimentResults||typeof s.experimentResults!=='object'||Object.values(s.experimentResults).some(x=>typeof x!=='string'))return null;
 if(!Number.isFinite(s.volume)||s.volume<0||s.volume>50)return null;
 if(s.timelineOK&&!s.timeline.every((id,i)=>id===TIMELINE[i].id))return null;
 if(s.end&&(!s.timelineOK||CONCLUSIONS.some(c=>!s.report[c.id])))return null;
 if(s.dialogue!=null){const d=s.dialogue;if(!d||!Array.isArray(d.lines)||!d.lines.length||d.lines.length>40||d.lines.some(l=>!l||typeof l.speaker!=='string'||typeof l.text!=='string')||!Number.isInteger(d.index)||d.index<0||d.index>=d.lines.length||(d.actionId!=null&&!ACTIONS.some(a=>a.id===d.actionId&&a.room===s.room&&(a.min||1)<=s.chapter)))return null;}return {...blankState(),...s,audio:false};
}

let activeNotebook=null,feedback='',revisit=false;
function has(id){return state.found.includes(id)||state.flags.includes(id)||state.threads.includes(id);}
function remember(id){if(!(id in EVIDENCE))throw Error('Unknown note');if(!state.found.includes(id))state.found.push(id);}
function flag(id){if(!state.flags.includes(id))state.flags.push(id);}
function archiveHistory(lines){state.feed=lines;state.history.push({room:state.room,chapter:state.chapter,lines});state.history=state.history.slice(-80);}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));$('#saved').textContent='进度已记下';}catch(e){$('#saved').textContent='无法自动保存，可手动保存进度';}}
function available(a){return a&&(a.min||1)<=state.chapter&&ROOMS[a.room].min<=state.chapter&&(!a.requires||a.requires.every(has));}
function legacyPerformAction(id){const a=ACTIONS.find(a=>a.id===id);if(!state.started||!available(a)||a.room!==state.room)return{ok:false,message:'现在不能进行这项调查。'};if(state.done.includes(id)){archiveHistory(a.lines);save();return{ok:true,repeated:true};}a.give.forEach(remember);if(a.flag)flag(a.flag);state.done.push(id);archiveHistory(a.lines);if(a.sfx)ambient.cue(a.sfx);else if(id==='lock')ambient.cue('latch');else if(id==='index')ambient.cue('tape');else if(a.give.length)ambient.cue('paper');feedback=a.give.length?'我把这次看到和听到的内容记进了笔记。':'';save();return{ok:true,notes:a.give};}
function moveTo(room){if(!ROOMS[room]||ROOMS[room].min>state.chapter)return false;state.room=room;state.view='scene';revisit=false;feedback='';archiveHistory(SCENES[room].dialogues.map(d=>[d.speaker==='侦探'?'我':d.speaker,d.text]));queueDialogue(SCENES[room].dialogues);save();render();ambient.update();return true;}
function start(){state.started=true;state.room='door';state.view='scene';archiveHistory(CHAPTERS[0].intro);queueDialogue(dialogueData(CHAPTERS[0].intro));save();render();$('#surface').scrollIntoView({block:'start'});}
function chapterReady(){return CHAPTERS[state.chapter-1].need.every(has);}
function advance(){if(state.chapter>=4||!chapterReady())return false;state.chapter++;state.view='scene';state.room=state.chapter===4?'cheng':'chen';archiveHistory(CHAPTERS[state.chapter-1].intro);queueDialogue(dialogueData(CHAPTERS[state.chapter-1].intro));feedback='';save();render();ambient.update();window.scrollTo({top:0,behavior:'smooth'});return true;}
function legacyLinkNotes(a,b,relation){if(a===b||!state.found.includes(a)||!state.found.includes(b))return{ok:false,message:'我得选两份不同的已有记录。'};const t=THREADS.find(t=>(t.min||1)<=state.chapter&&t.pairs.some(pair=>pair.includes(a)&&pair.includes(b)));if(!t)return{ok:false,message:'我把两份记录并排放下。暂时还接不起来；先回到它们各自描述的事情。'};if(t.relation!==relation)return{ok:false,message:'这两份记录值得放在一起，但我选的联系不合适。再看它们的时间、位置，或谁说了什么。'};if(!state.threads.includes(t.id)){state.threads.push(t.id);archiveHistory(t.result);}save();return{ok:true,thread:t.id,lines:t.result};}

function chapterTasks(){return CHAPTERS[state.chapter-1].need.map(id=>({id,title:THREADS.find(t=>t.id===id)?.title||({chain:'门外能否挂上门链？',sound:'低语随什么改变？',weapon:'罐子与伤口、清洗痕迹有关吗？',restored:'播放器删掉了哪段？'})[id],done:has(id)}));}

 else if(v.power==='on'&&v.position==='table'){flag('soundTable');result={ok:true,partial:true,message:'移到茶几，风声仍在，但那一组峰显著减弱。我把它和矮柜录音放在一起。'};}

function investigationGrade(){const optional=THREADS.filter(t=>t.optional),complete=optional.filter(t=>has(t.id)).length,coverage=Math.round(state.found.length/Object.keys(EVIDENCE).length*100),hintsUsed=Object.values(state.hints).reduce((a,b)=>a+b,0);const meticulous=complete===optional.length&&coverage>=95&&state.crosses.length===4;return {rank:meticulous?'完整归档':state.crosses.length===4?'真相还原':'雨中结案',coverage,complete,total:optional.length,hintsUsed,comment:meticulous?'主线证据闭合，旁支疑点均已排除。那场雨里留下的误读，也被写回了事实。':state.crosses.length===4?'原始记录推翻了四项陈述。案件已经还原，仍有旁支细节可以回访。':'五项结论已被证据支持。对质与旁支记录仍可继续补齐。'};}
function renderEnding(){const grade=investigationGrade();
 $('#surface').innerHTML=`<div class="ending-hero"><span class="eyebrow">CASE CLOSED / DAWN</span><h2>预言没有走在她前面。</h2><div class="ending-rank">${grade.rank}</div><p class="muted" style="font-size:13px;margin-top:15px">${grade.comment}</p><div class="score-grid"><div><b>${grade.coverage}%</b><span>证据覆盖</span></div><div><b>${grade.complete}/${grade.total}</b><span>旁支已核验</span></div><div><b>${state.crosses.length}/4</b><span>证词已核对</span></div></div><p class="muted" style="font-size:11px">推论尝试 ${state.stats.linksTried} 次 · 实验 ${state.stats.experiments} 次 · 提示 ${grade.hintsUsed} 级。评价依据调查完整度，重试不会改变案件真相。</p></div><section class="ending-account">${lineHTML([['我','程知远没有再问查清了没有。他看着隧道原片停下的那一帧，手指攥住了椅子的边缘。'],['陈警官','“把录音和物证带走。”'],['我','窗外亮了。我这才发现，空调停下以后，这屋里安静得有些陌生。']])}</section><section class="ending-account"><h3>昨夜</h3><p>21:50，程离开便利店；21:55进入602。恢复的原始声音留下他的名字，也留下他与苏晚关于隧道视频的争论。约22:10，可可罐造成了致命后脑伤。</p><p>罐中的粉被倒空，罐体清洗后放回架子。22:12，空调启动，录音笔被移到矮柜；机器与位置的共振被录成“低语”。22:20，他制作“不要回头”的语音；22:24，草稿里第一次出现死亡预言。</p><p>离开时，门锁自行锁住，门链从外侧被操作。门内的状态，让人误以为没有第二个人。</p></section><section class="ending-account"><h3>她发现的事</h3><p>前六期先有新闻，后有节目，却被填写为更早的日期。苏晚发现隧道原片并保留备份，准备核实、报警。原片把程接回那起肇事逃逸旧案；她的发现，成了他杀人的动机。</p><p>第七期没有提前预告死亡。那句话，是伤害发生以后才写进去的。</p></section><details class="ending-account"><summary>回看那些岔路</summary><p>黑伞客等待的是605的带看钥匙。灯泡暗，是老赵未报备的更换。窗孔来自旧纱窗。21:52的句子是脚本试读；便利店画面只覆盖程在店里的那一段。尸温早期估计的环境假设，需要用空调记录重新核查。</p><p>他们隐瞒的事情并不相同。排除一项误读，与找到一项支持证据同样重要。</p></details><div class="row" style="margin-top:25px"><button class="primary" id="exportReport">保存完整调查报告</button><button class="quiet" id="reviewJournal">回到证据板</button><button class="quiet" id="continueReview">补齐支线与对质</button></div><p class="ending-caption">虚构推理游戏。复现结构与频谱为叙事示意；调查与合成音效均在本地运行。</p>`;
 $('#exportReport').onclick=exportReport;$('#reviewJournal').onclick=()=>setView('notebook');$('#continueReview').onclick=()=>setView('dossier');
}
function openCaseFile(){showModal(`<span class="eyebrow">CASE FILE / 007</span><h2>第七个预言 · 案件档案</h2><p class="muted">雨水巷7号 / 602 / 案发次日</p><p>00:50报警，01:02拍摄开门前照片，01:10勘查入场。现场窗关闭，门链挂住，屋内持续运行冷气。</p><p>调查方向：密室状态、节目日期、录音异常。所有结论需要用已经核验的事实支撑。</p><div class="profile-row"><span>当前模式</span><b>${MODES[state.mode][0]}</b></div><div class="profile-row"><span>证据</span><b>${state.found.length} / ${Object.keys(EVIDENCE).length}</b></div><div class="profile-row"><span>已解疑点</span><b>${state.threads.length} / ${THREADS.length}</b></div><button id="caseExport" class="quiet">导出当前进度</button>`);$('#caseExport').onclick=downloadSave;}
function downloadSave(){download('第七个预言_档案版_进度.json',JSON.stringify({version:CASE_VERSION,state},null,2),'application/json');}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),link=document.createElement('a');link.href=url;link.download=name;link.style.display='none';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);notify('文件已生成，请查看浏览器下载记录。');}
async function loadSave(e){const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error();const saved=JSON.parse(await file.text());if(!['2.0','3.0'].includes(saved.version))throw Error();const next=readUpgradedState(saved.state);if(!next)throw Error();ambient.disable();state=next;selectedNotes=[...state.pins];save();$('#modal').close();render();notify(saved.version==='2.0'?'旧版调查进度已迁入档案版。':'调查进度已载入。');}catch(error){$('#importResult').textContent='进度文件无效或数据不完整。当前调查已保留。';}e.target.value='';}
function settings(){showModal(`<span class="eyebrow">ARCHIVE SETTINGS</span><h2>调查设置</h2><p class="muted" style="font-size:12px">模式可以随时切换，已收录的记录会保留。</p><div class="mode-select">${Object.entries(MODES).map(([id,[name,desc]])=>`<button data-setting-mode="${id}" class="${state.mode===id?'selected':''}">${name}模式<small>${desc}</small></button>`).join('')}</div><p style="font-size:12px;color:var(--muted)">叙事：允许直接提交有证据的结论。推理：归档前完成四轮对质。专家：第二幕还需排除黑伞与阴冷传闻，并关闭直接答案提示。</p><div class="settings-grid"><button id="saveFile" class="quiet">导出进度文件</button><label class="file-button">导入进度文件（兼容原版2.0）<input type="file" id="loadFile" accept=".json,application/json"></label><p class="feedback" id="importResult" role="status"></p><button class="danger-button" id="restartBtn">重新调查</button></div><p class="muted" style="font-size:11px">网页不连接网络。自动存档仅在当前浏览器中保存，迁移设备前请导出进度。</p>`);bindAll('[data-setting-mode]',node=>{state.mode=node.dataset.settingMode;save();$('#modal').close();render();notify('已切换为'+MODES[state.mode][0]+'模式');});$('#saveFile').onclick=downloadSave;$('#loadFile').onchange=loadSave;$('#restartBtn').onclick=()=>{showModal('<span class="eyebrow">NEW INVESTIGATION</span><h2>重新开始调查</h2><p>重新开始会替换当前浏览器内的进度。可先导出一份进度文件。</p><div class="row"><button class="quiet" id="restartExport">先导出进度</button><button class="danger-button" id="confirmRestart">清空当前进度并重新开始</button></div>');$('#restartExport').onclick=downloadSave;$('#confirmRestart').onclick=()=>{const mode=state.mode;ambient.disable();state=blankState();state.mode=mode;selectedNotes=[];noteSearch='';noteCategory='';activeCross='presence';showDone=false;save();$('#modal').close();render();};};}
function exportReport(){const grade=investigationGrade();const text='第七个预言 · 档案重制版\n调查评价：'+grade.rank+'\n证据覆盖：'+grade.coverage+'%\n模式：'+MODES[state.mode][0]+'\n\n案发夜时间线\n'+state.timeline.map(id=>{const t=TIMELINE.find(t=>t.id===id);return t.time+' '+t.text;}).join('\n')+'\n\n案件结论\n'+CONCLUSIONS.filter(c=>state.report[c.id]).map(c=>c.label+'：'+state.report[c.id].answer+'\n依据：'+state.report[c.id].proof.map(id=>EVIDENCE[id][0]).join('、')).join('\n\n')+'\n\n已核验的疑点\n'+THREADS.filter(t=>has(t.id)).map(t=>t.title+'\n'+t.result.map(l=>l[1]).join('\n')).join('\n\n')+'\n\n证词对质\n'+CROSSES.filter(c=>state.crosses.includes(c.id)).map(c=>c.label+'：'+c.claim+'\n'+c.reply).join('\n\n')+'\n\n证据目录\n'+state.found.map(id=>noteNumber(id)+' '+EVIDENCE[id][0]+'\n来源：'+NOTE_META[id][1]+'\n'+EVIDENCE[id][1]).join('\n\n')+'\n\n我的备忘\n'+state.notes;download('第七个预言_完整调查报告.txt',text);}

// Restore after the catalogs above are ready; audio always requires a new gesture.
try{const raw=JSON.parse(localStorage.getItem(SAVE_KEY)),saved=readUpgradedState(raw);if(saved)state=saved;else{const legacy=readUpgradedState(JSON.parse(localStorage.getItem('seventh-prophecy-offline-v2')));if(legacy)state=legacy;}}catch(error){}
selectedNotes=[...state.pins];state.audio=false;
$('#soundBtn').onclick=async()=>{if(state.audio)ambient.disable();else await ambient.enable();render();};$('#volume').oninput=e=>{state.volume=Number(e.target.value);ambient.update();save();};$('#settingsBtn').onclick=settings;$('#closeModal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close();};document.addEventListener('visibilitychange',()=>{if(document.hidden)ambient.pause();else ambient.resume().catch(()=>{});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').open&&playingDialogue()){notify('可点击“读完整段”结束当前对话。');}if(!state.started||playingDialogue()||$('#modal').open||['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target?.tagName))return;if(e.key==='b'){setView('notebook');}if(e.key==='m'){setView('map');}});
render();


</script></body></html>
