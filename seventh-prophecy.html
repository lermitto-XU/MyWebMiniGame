function dialogueData(lines){return lines.map(([speaker,text])=>({speaker:speaker==='我'?'侦探':speaker,text}));}
// A single catalog owns each room's presentation, dialogue and investigation items.
const SCENES=Object.fromEntries(Object.entries(ROOMS).map(([id,room])=>[id,{
 id,name:room.name,min:room.min,...SCENE_VISUALS[id],
 dialogues:[{speaker:'侦探',text:room.intro},{speaker:'侦探',text:SCENE_VISUALS[id].line}],
 items:ACTIONS.filter(a=>a.room===id).map(a=>({...a,dialogues:dialogueData(a.lines)}))
}]));

function queueDialogue(lines,actionId=null){state.dialogue={lines,index:0,actionId};save();}
function playingDialogue(){return state.view==='scene'&&state.dialogue&&state.dialogue.index<state.dialogue.lines.length;}
function playInvestigation(id){const item=SCENES[state.room].items.find(a=>a.id===id);if(!available(item)||playingDialogue())return false;queueDialogue(item.dialogues,id);render();return true;}
function nextDialogue(){if(!playingDialogue())return false;const session=state.dialogue;session.index++;if(session.index>=session.lines.length){state.dialogue=null;if(session.actionId)performAction(session.actionId);save();const box=$('#galDialogue');if(box){box.classList.add('dialogue-leaving');box.disabled=true;}setTimeout(()=>{if(!state.dialogue&&state.view==='scene')render();},180);}else{save();paintDialogue();}return true;}
function paintDialogue(){const box=$('#galDialogue');if(!box||!playingDialogue())return;const d=state.dialogue.lines[state.dialogue.index];$('#dialogueSpeaker').textContent=d.speaker;$('#dialogueText').textContent=d.text;$('#dialogueCount').textContent=(state.dialogue.index+1)+' / '+state.dialogue.lines.length;box.setAttribute('aria-label',d.speaker+'：'+d.text+'。点击继续');}
function dialogueHTML(){return playingDialogue()?'<button type="button" class="gal-dialogue" id="galDialogue"><span class="gal-speaker" id="dialogueSpeaker"></span><span class="gal-text" id="dialogueText" aria-live="polite"></span><span class="gal-footer"><span id="dialogueCount"></span><span>点击 / 空格 / 回车继续 <span class="gal-arrow" aria-hidden="true">▼</span></span></span></button>':'';}
function bindDialogue(){if(!playingDialogue())return;paintDialogue();$('#galDialogue').onclick=nextDialogue;}
document.addEventListener('keydown',e=>{if(!playingDialogue()||e.repeat||![' ','Enter'].includes(e.key))return;const tag=e.target?.tagName;if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(tag)||$('#modal').open)return;e.preventDefault();nextDialogue();});

const SAVE_KEY='seventh-prophecy-offline-v2';
function blankState(){return{started:false,chapter:1,room:'door',view:'scene',found:[],flags:[],threads:[],done:[],feed:[],history:[],hints:{},notes:'',end:false,experimentResults:{},report:{},timeline:['write','leave','memo','chain','arrive','air','hurt'],timelineOK:false,audio:false,volume:18,dialogue:null};}
let state=blankState();
function readSavedState(s){
 if(!s||typeof s!=='object'||s.chapter<1||s.chapter>4||!Number.isInteger(s.chapter)||!ROOMS[s.room]||ROOMS[s.room].min>s.chapter||!['scene','notebook','experiments','reconstruction'].includes(s.view))return null;
 const validArrays={found:Object.keys(EVIDENCE),done:ACTIONS.map(a=>a.id),threads:THREADS.map(t=>t.id)};
 for(const [key,allowed] of Object.entries(validArrays))if(!Array.isArray(s[key])||s[key].some(id=>!allowed.includes(id)))return null;
 if(!Array.isArray(s.flags)||s.flags.some(x=>typeof x!=='string')||!Array.isArray(s.timeline)||s.timeline.length!==TIMELINE.length||new Set(s.timeline).size!==TIMELINE.length||s.timeline.some(id=>!TIMELINE.some(t=>t.id===id)))return null;
 const validLines=lines=>Array.isArray(lines)&&lines.length<=40&&lines.every(line=>Array.isArray(line)&&line.length===2&&line.every(x=>typeof x==='string'));
 if(!validLines(s.feed)||!Array.isArray(s.history)||s.history.some(h=>!h||!ROOMS[h.room]||!validLines(h.lines))||typeof s.notes!=='string'||s.notes.length>100000)return null;
 if(!s.report||typeof s.report!=='object'||Array.isArray(s.report))return null;
 for(const [id,p] of Object.entries(s.report)){const c=CONCLUSIONS.find(c=>c.id===id);if(!c||!p||p.answer!==c.answer||!Array.isArray(p.proof)||p.proof.length>3||p.proof.some(x=>!s.found.includes(x))||!c.sets.some(set=>set.every(x=>p.proof.includes(x))))return null;}
 if(typeof s.started!=='boolean'||typeof s.end!=='boolean'||!s.hints||typeof s.hints!=='object'||Array.isArray(s.hints)||Object.values(s.hints).some(n=>!Number.isInteger(n)||n<0||n>3)||!s.experimentResults||typeof s.experimentResults!=='object'||Object.values(s.experimentResults).some(x=>typeof x!=='string'))return null;
 if(!Number.isFinite(s.volume)||s.volume<0||s.volume>50)return null;
 if(s.timelineOK&&!s.timeline.every((id,i)=>id===TIMELINE[i].id))return null;
 if(s.end&&(!s.timelineOK||CONCLUSIONS.some(c=>!s.report[c.id])))return null;
 if(s.dialogue!=null){const d=s.dialogue;if(!d||!Array.isArray(d.lines)||!d.lines.length||d.lines.length>40||d.lines.some(l=>!l||typeof l.speaker!=='string'||typeof l.text!=='string')||!Number.isInteger(d.index)||d.index<0||d.index>=d.lines.length||(d.actionId!=null&&!ACTIONS.some(a=>a.id===d.actionId&&a.room===s.room&&(a.min||1)<=s.chapter)))return null;}return {...blankState(),...s,audio:false};
}

let activeNotebook=null,feedback='',revisit=false;
function has(id){return state.found.includes(id)||state.flags.includes(id)||state.threads.includes(id);}
function remember(id){if(!(id in EVIDENCE))throw Error('Unknown note');if(!state.found.includes(id))state.found.push(id);}
function flag(id){if(!state.flags.includes(id))state.flags.push(id);}
function archiveHistory(lines){state.feed=lines;state.history.push({room:state.room,chapter:state.chapter,lines});state.history=state.history.slice(-80);}

function lineHTML(lines){return lines.map(([who,text])=>`<div class="line ${who==='我'?'narration':'dialogue'}">${who==='我'?'':`<span class="speaker">${escapeHTML(who)}</span>`}<p>${escapeHTML(text)}</p></div>`).join('');}
function renderScene(){const scene=SCENES[state.room],busy=playingDialogue();const visible=scene.items.filter(a=>available(a)&&(!state.done.includes(a.id)||revisit));
$('#surface').innerHTML=`<div class="scene-heading"><span class="eyebrow">${scene.name}</span><button class="quiet" id="where">换一个地方</button></div><nav class="places" id="places" aria-label="前往房间">${Object.values(SCENES).filter(r=>r.min<=state.chapter).map(r=>`<button data-room="${r.id}" class="${r.id===state.room?'selected':''}">${r.name}</button>`).join('')}</nav><section class="room-stage room-${scene.kind} ${busy?'dialogue-playing':''}" style="--room-color:${scene.background}" aria-label="${scene.name}"><div class="room-light"></div><div class="room-grain"></div><div class="room-props" aria-hidden="true">${scene.objects.map((name,i)=>`<div class="room-prop prop-${i}"><span>${name}</span></div>`).join('')}</div><div class="stage-caption"><span>${scene.detail}</span><h2>${scene.caption}</h2></div><div class="room-interactions" ${busy?'hidden inert':''}><span class="choice-caption">我接下来……</span>${visible.map(a=>`<button data-action="${a.id}" class="investigation-item ${state.done.includes(a.id)?'revisit':''}">${escapeHTML(a.label)}${state.done.includes(a.id)?'<small>重看</small>':''}</button>`).join('')||'<p>这里暂时没有新的追问。可以翻开笔记，或去别处核对。</p>'}${state.chapter>=3&&state.room==='lab'?'<button id="openLab">摆好材料，开始验证</button>':''}${state.chapter===4&&state.room==='cheng'?'<button id="startReport">把这些事写成一份还原</button>':''}</div>${busy?'<p class="stage-listening">先听完这段交谈，再动手调查。</p>':''}</section>${dialogueHTML()}<section class="scene-followup" ${busy?'hidden':''}>${feedback?`<p class="feedback soft" role="status">${escapeHTML(feedback)}</p>`:''}${taskBoard()}${!chapterReady()&&state.chapter<4?'<button class="task-link" id="pendingTasks">'+(state.chapter<3?'翻开笔记，整理待解疑点':'前往复现与检验')+'</button>':''}<div class="scene-foot"><button class="text-button" id="revisit">${revisit?'只看未做的调查':'重看这里的观察与对话'}</button><button class="text-button" id="past">回看此前的交谈</button><button class="text-button" id="replayEntrance">重看进入房间</button></div>${state.chapter<4&&chapterReady()?'<div class="chapter-transition"><p>陈警官合上记录本：“把这些疑点带上，我们接着查。”</p><button class="primary" id="advance">继续调查</button></div>':''}</section>`;
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>moveTo(b.dataset.room));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>playInvestigation(b.dataset.action));$('#where').onclick=()=>$('#places').classList.toggle('expanded');$('#revisit').onclick=()=>{revisit=!revisit;render();};$('#replayEntrance').onclick=()=>moveTo(state.room);$('#past').onclick=()=>{$('#modalContent').innerHTML='<h2>此前的交谈</h2>'+state.history.slice(-12).map(h=>`<div class="history-block"><small>${ROOMS[h.room]?.name||''}</small>${lineHTML(h.lines)}</div>`).join('');$('#modal').showModal();};if($('#pendingTasks'))$('#pendingTasks').onclick=()=>setView(state.chapter<3?'notebook':'experiments');if($('#advance'))$('#advance').onclick=advance;if($('#openLab'))$('#openLab').onclick=()=>setView('experiments');if($('#startReport'))$('#startReport').onclick=()=>setView('reconstruction');bindDialogue();}

function showNote(id){if(!has(id)||!EVIDENCE[id])return;$('#modalContent').innerHTML=`<span class="eyebrow">现场笔记</span><h2>${EVIDENCE[id][0]}</h2><p>${EVIDENCE[id][1]}</p>`;$('#modal').showModal();}
function renderNotebook(){const currentThreads=THREADS.filter(t=>(t.min||1)<=state.chapter);$('#surface').innerHTML=`<span class="eyebrow">笔记 / 联系</span><h2>两份记录之间，藏着什么？</h2><p class="muted">选择两份记录，再选择你发现的联系。这里保存事实；解释由你来提出。</p><div id="notebookTasks">${taskBoard()}</div><details class="other-threads"><summary>此前的疑点与旁支记录</summary><div class="thread-list">${currentThreads.filter(t=>!CHAPTERS[state.chapter-1].need.includes(t.id)).map(t=>`<span class="${has(t.id)?'resolved':''}">${has(t.id)?'✓ ':''}${t.title}${t.optional?' · 旁支，不影响继续调查':''}</span>`).join('')||'暂无其他记录。'}</div></details><form id="compareForm" class="comparison"><div class="two-notes"><label>第一份记录<select id="noteA" required><option value="">选择记录</option>${noteOptions()}</select></label><label>第二份记录<select id="noteB" required><option value="">选择记录</option>${noteOptions()}</select></label></div><div id="comparisonPreview" class="comparison-preview"></div><fieldset><legend>我发现的是……</legend><div class="relation-choices">${RELATIONS.map(([id,t])=>`<label><input type="radio" name="relation" value="${id}" required>${t}</label>`).join('')}</div></fieldset><button class="primary">把联系告诉陈警官</button><div id="compareResult" role="status"></div></form><h3 class="section-label">全部记录</h3><div class="journal-grid">${state.found.map(id=>`<article class="journal-entry"><button class="journal-title" data-journal="${id}">${EVIDENCE[id][0]}</button><p>${EVIDENCE[id][1]}</p></article>`).join('')}</div>`;
$('#compareForm').onsubmit=e=>{e.preventDefault();const relation=new FormData(e.target).get('relation');const result=linkNotes($('#noteA').value,$('#noteB').value,relation);refreshTasks();const next=chapterTasks().find(t=>!t.done);$('#compareResult').innerHTML=result.ok?`<div class="result-dialogue">${lineHTML(result.lines)}<div class="next-task" tabindex="-1"><strong>${chapterReady()?'本幕疑点已全部厘清':next?'还有待解疑点：'+next.title:'这条联系已记下'}</strong><p>${chapterReady()?'陈警官合上记录本，示意我继续调查。':next?'调查还没有结束。继续对照笔记；缺少记录时，可以回现场追问。':'可以回到现场继续核查。'}</p><button class="primary" id="nextTask">${chapterReady()?'继续调查':next&&state.chapter<3?'继续整理下一疑点':'回到现场'}</button>${!chapterReady()?'<button class="quiet" id="returnScene">回现场补充记录</button>':''}</div></div>`:`<p class="feedback">${escapeHTML(result.message)}</p>`;if(result.ok){$('#nextTask').onclick=()=>{if(chapterReady()&&state.chapter<4)advance();else if(next&&state.chapter<3){$('#compareForm').reset();$('#comparisonPreview').innerHTML='';$('#compareResult').innerHTML=`<p class="focus-question">接下来：${next.title}</p>`;$('#compareForm').scrollIntoView({behavior:'smooth',block:'start'});$('#noteA').focus();}else setView('scene');};if($('#returnScene'))$('#returnScene').onclick=()=>setView('scene');$('#compareResult').scrollIntoView({behavior:'smooth',block:'nearest'});}};const preview=()=>{$('#comparisonPreview').innerHTML=[$('#noteA').value,$('#noteB').value].filter(id=>EVIDENCE[id]).map(id=>`<div><strong>${EVIDENCE[id][0]}</strong><p>${EVIDENCE[id][1]}</p></div>`).join('');};$('#noteA').onchange=preview;$('#noteB').onchange=preview;document.querySelectorAll('[data-journal]').forEach(b=>b.onclick=()=>showNote(b.dataset.journal));}
function noteOptions(){return state.found.map(id=>`<option value="${id}">${EVIDENCE[id][0]}</option>`).join('');}
function selectHTML(id,label,options){return `<label>${label}<select id="${id}">${options.map(([value,text])=>`<option value="${value}">${text}</option>`).join('')}</select></label>`;}
function renderExperiments(){if(state.chapter<3){$('#surface').innerHTML='<span class="eyebrow">复现与检验</span><h2>先弄清楚，要重做什么。</h2><div class="story"><p>样板门和原始存储还没有送到。我得先完成现场记录，再去核对人物和时间。</p></div>';return;}
$('#surface').innerHTML=`<span class="eyebrow">复现与检验 / 可重复</span><h2>我把条件写在纸上。</h2><p class="muted">结果只对应你选择的条件。声音实验要有对照；凶器检验要联系伤口和清洗痕迹。</p><section class="experiment"><div class="experiment-heading"><span>01</span><h3>门外，能否挂上门链？</h3>${has('chain')?'<small>已完成</small>':''}</div><p>使用同款样板门，门向室内打开，滑槽在内侧。照片中门链限位时的开口约六厘米。</p><div class="structural-diagram" aria-label="门链结构示意"><span>门外 · 工具</span><span class="diagram-gap">门缝</span><span>门内 · 链扣 → 滑槽</span></div><form data-exp="chain"><div class="form-grid">${selectHTML('chainGap','门的开口',[['0','完全关严'],['6','约六厘米']])}${selectHTML('chainTool','工具末端',[['straight','直杆'],['hook','弯钩']])}${selectHTML('chainOperation','操作方式',[['pull','只向外拉链扣'],['push-close','推送链扣后关门，再退出工具']])}</div><button>按这个条件复现</button><div class="experiment-result" role="status">${escapeHTML(state.experimentResults.chain||'')}</div></form></section><section class="experiment"><div class="experiment-heading"><span>02</span><h3>低语随什么改变？</h3>${has('sound')?'<small>已完成</small>':''}</div><p>使用同一支录音笔，对照空调关闭、矮柜和茶几三种条件。</p><form data-exp="sound"><div class="form-grid">${selectHTML('soundPower','空调',[['off','关闭'],['on','最大风量']])}${selectHTML('soundPosition','录音位置',[['table','茶几'],['cabinet','矮柜']])}</div><button>录制并看频谱</button><div class="experiment-result" role="status">${escapeHTML(state.experimentResults.sound||'')}</div></form><div class="sample-status">关闭对照 ${has('soundOff')?'✓':'○'}　矮柜 ${has('soundCabinet')?'✓':'○'}　茶几 ${has('soundTable')?'✓':'○'}</div></section><section class="experiment"><div class="experiment-heading"><span>03</span><h3>这只罐子与伤口有关吗？</h3>${has('weapon')?'<small>已完成</small>':''}</div><form data-exp="weapon"><div class="form-grid">${selectHTML('weaponSample','取样位置',[['surface','罐体光滑表面'],['tea','茶叶罐外侧'],['edge','可可罐底部凸边缝隙']])}${selectHTML('weaponCompare','比对对象',[['weight','罐子重量'],['wound','死者DNA与创缘形态']])}</div><button>送检这一份样本</button><div class="experiment-result" role="status">${escapeHTML(state.experimentResults.weapon||'')}</div></form><button class="quiet" id="drainTest">同时检验水槽U型管</button><p class="experiment-result" id="drainResult">${escapeHTML(state.experimentResults.drain||'')}</p></section><section class="experiment"><div class="experiment-heading"><span>04</span><h3>播放器删掉了哪段？</h3>${has('restored')?'<small>已恢复</small>':''}</div><p>技术员等我指出来源与时段。导出后的文件，与原始存储不是同一份材料。</p><form data-exp="restore"><div class="form-grid">${selectHTML('restoreSource','读取来源',[['export','播放器里的导出文件'],['original','录音笔原始存储']])}${selectHTML('restoreRange','要核查的时段',[['21:00','21:00—21:15'],['21:55','21:55—22:09'],['22:12','22:12—22:13']])}</div><button>请求恢复这一段</button><div class="experiment-result" role="status">${escapeHTML(state.experimentResults.restore||'')}</div></form></section>${chapterReady()?'<button class="primary" id="advance">带着实验记录继续调查</button>':''}`;
document.querySelectorAll('[data-exp]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const k=f.dataset.exp;const v=k==='chain'?{gap:$('#chainGap').value,tool:$('#chainTool').value,operation:$('#chainOperation').value}:k==='sound'?{power:$('#soundPower').value,position:$('#soundPosition').value}:k==='weapon'?{sample:$('#weaponSample').value,compare:$('#weaponCompare').value}:{source:$('#restoreSource').value,range:$('#restoreRange').value};const r=experiment(k,v);f.querySelector('.experiment-result').textContent=r.message;refreshLabSummary();});$('#drainTest').onclick=()=>{const r=experiment('drain',{});$('#drainResult').textContent=r.message;refreshLabSummary();};if($('#advance'))$('#advance').onclick=advance;}
function refreshLabSummary(){const existing=$('#labContinue');if(chapterReady()&&!$('#advance')&&!existing){const b=document.createElement('button');b.id='labContinue';b.className='primary';b.textContent='带着实验记录继续调查';b.onclick=advance;$('#surface').appendChild(b);}const notes=$('.recent-notes');if(notes){notes.innerHTML=state.found.slice(-6).reverse().map(id=>`<button data-note="${id}">${EVIDENCE[id][0]}</button>`).join('');notes.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>showNote(b.dataset.note));}const status=$('.sample-status');if(status)status.textContent=`关闭对照 ${has('soundOff')?'✓':'○'}　矮柜 ${has('soundCabinet')?'✓':'○'}　茶几 ${has('soundTable')?'✓':'○'}`;}
function timelineHTML(){return state.timeline.map((id,i)=>{const t=TIMELINE.find(t=>t.id===id);return `<li draggable="true" data-event="${id}"><span class="sequence-number">${i+1}</span><span>${t.text}</span><div class="order-controls"><button type="button" data-order="${i},-1" aria-label="将${t.text}前移" ${i===0?'disabled':''}>↑</button><button type="button" data-order="${i},1" aria-label="将${t.text}后移" ${i===state.timeline.length-1?'disabled':''}>↓</button></div></li>`;}).join('');}
function swapOrder(i,delta){const j=i+delta;if(j<0||j>=state.timeline.length)return;[state.timeline[i],state.timeline[j]]=[state.timeline[j],state.timeline[i]];state.timelineOK=false;save();$('#eventOrder').innerHTML=timelineHTML();bindTimeline();}
function bindTimeline(){document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.order.split(',').map(Number);swapOrder(i,d);});let dragId=null;document.querySelectorAll('[data-event]').forEach(li=>{li.ondragstart=e=>{dragId=li.dataset.event;e.dataTransfer.setData('text/plain',dragId);};li.ondragover=e=>e.preventDefault();li.ondrop=e=>{e.preventDefault();const from=state.timeline.indexOf(dragId||e.dataTransfer.getData('text/plain')),to=state.timeline.indexOf(li.dataset.event);if(from<0||to<0)return;const[x]=state.timeline.splice(from,1);state.timeline.splice(to,0,x);state.timelineOK=false;save();$('#eventOrder').innerHTML=timelineHTML();bindTimeline();};});}
function renderReconstruction(){if(state.chapter<4){$('#surface').innerHTML='<span class="eyebrow">案件还原</span><h2>我还没有看见完整的一晚。</h2><div class="story"><p>先把现场、人物和实验核对完，再到第四幕与程对质。现在就填结论，只会把猜测写成事实。</p></div>';return;}
$('#surface').innerHTML=`<span class="eyebrow">案件还原 / 提交给陈警官</span><h2>从他离开便利店开始。</h2><p class="muted">排列事件，再为每一段解释附上最直接的两至三份记录。拖动事件或用箭头调整顺序。</p><section class="reconstruction"><h3>案发夜的先后</h3><ol id="eventOrder" class="event-order">${timelineHTML()}</ol><button id="verifyOrder">核对事件顺序</button><p class="feedback" id="orderResult" role="status">${state.timelineOK?'顺序已核对。':''}</p></section>${CONCLUSIONS.map(c=>`<section class="reconstruction"><h3>${c.label}</h3>${state.report[c.id]?`<p class="accepted">${escapeHTML(state.report[c.id].answer)}</p><p class="muted">${state.report[c.id].proof.map(id=>EVIDENCE[id][0]).join(' · ')}</p><button class="text-button" data-edit="${c.id}">重新整理这一段</button>`:`<form data-report="${c.id}"><label class="report-answer">我的解释<select name="answer">${c.options.map(x=>`<option>${escapeHTML(x)}</option>`).join('')}</select></label><details class="proof-details"><summary>附上最直接的记录（最多三份）</summary><div class="proof-list">${state.found.map(id=>`<label><input type="checkbox" name="proof" value="${id}">${EVIDENCE[id][0]}</label>`).join('')}</div></details><button>把这一段交给陈警官</button><p class="feedback" role="status"></p></form>`}</section>`).join('')}<button id="finishCase" class="primary">提交完整还原</button><p id="finishResult" class="feedback" role="status"></p>`;bindTimeline();$('#verifyOrder').onclick=()=>{$('#orderResult').textContent=validateTimeline(state.timeline).message;};document.querySelectorAll('[data-report]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const r=validateConclusion(f.dataset.report,fd.get('answer'),fd.getAll('proof'));if(r.ok){const y=window.scrollY;render();window.scrollTo({top:y});}else f.querySelector('.feedback').textContent=r.message;});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{delete state.report[b.dataset.edit];save();render();});$('#finishCase').onclick=()=>{const r=finish();if(!r.ok)$('#finishResult').textContent=r.message;};}
function renderEnding(){$('#surface').innerHTML=`<span class="eyebrow">案卷归档 / 雨停了</span><h2>预言没有走在她前面。</h2><section class="story">${lineHTML([['我','程知远没有再问查清了没有。他看着隧道原片停下的那一帧，手指攥住了椅子的边缘。'],['陈警官','“把录音和物证带走。”'],['我','窗外亮了。我这才发现，空调停下以后，这屋里安静得有些陌生。']])}</section><div class="ending-account"><h3>昨夜</h3><p>21:50，程离开便利店；21:55进入602。恢复的声音留下了他的名字，也留下了他与苏晚关于隧道视频的争论。约22:10，可可罐造成了致命后脑伤。</p><p>他倒空罐子，清洗、擦干，放回架子。22:12开启空调，将录音笔移到矮柜，机器的共振被录成“低语”。随后，他制作语音笔记，补写第七期，并处理掉那段两人交谈的声音。</p><p>离开时，弹簧锁自行锁住，他在门外操作门链。屋内看起来，像从未有第二个人。</p><h3>她发现的事</h3><p>前六期先有新闻，后有节目，却被填上更早的日期。第1期借用了程肇事逃逸的隧道旧案。苏晚发现原片并留下备份，准备核实、报警。她的发现，成了程杀人的动机。</p><p>第七期没有提前预告死亡。那句话，是伤害发生以后才写进去的。</p></div><details class="ending-account"><summary>回看那些岔路</summary><p>黑伞人去看605，不是来守602。低亮灯泡是老赵没报备的小改动，他怕的是投诉。窗孔来自旧纱窗。21:52的句子是试读脚本。便利店的画面是真的，但只证明程在店里的那一段时间。</p><p>尸温初判中的环境假设被空调运行记录推翻。真正接起时间的，是核验过的原始声音、邻居的声响记录，以及晚于伤害事件的语音和文档。</p></details><div class="row"><button id="exportReport" class="primary">保存我的调查报告</button><button id="reviewJournal">继续翻看笔记</button></div><p class="muted ending-caption">这是一部虚构推理游戏。门链展示为同结构的简化复现；全部调查与音效均在设备本地运行。</p>`;$('#exportReport').onclick=exportReport;$('#reviewJournal').onclick=()=>{state.view='notebook';save();render();};}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadSave(){download('第七个预言_进度.json',JSON.stringify({version:CASE_VERSION,state},null,2),'application/json');}
async function loadSave(e){const file=e.target.files?.[0];if(!file)return;try{const saved=JSON.parse(await file.text());const next=saved.version===CASE_VERSION?readSavedState(saved.state):null;if(!next)throw Error();ambient.disable();state=next;save();render();}catch(err){$('#hintResult').textContent='这不是有效的进度文件。当前调查没有被覆盖。';}}
function exportReport(){download('第七个预言_调查报告.txt','第七个预言 · 调查报告\n\n'+state.timeline.map(id=>{const t=TIMELINE.find(t=>t.id===id);return t.time+' '+t.text;}).join('\n')+'\n\n'+CONCLUSIONS.map(c=>c.label+'：'+state.report[c.id].answer+'\n依据：'+state.report[c.id].proof.map(id=>EVIDENCE[id][0]).join('、')).join('\n\n')+'\n\n我的备忘\n'+state.notes);}
$('#soundBtn').onclick=async()=>{if(state.audio)ambient.disable();else await ambient.enable();render();};$('#volume').oninput=e=>{state.volume=Number(e.target.value);ambient.update();save();};$('#closeModal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)ambient.pause();else ambient.resume().catch(()=>{});});
// Restored sessions require a new gesture before browser audio can play.
state.audio=false;
render();
</script></body></html>
