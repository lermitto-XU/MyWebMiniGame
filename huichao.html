</style></head><body><div id="root"></div><dialog id="folio" aria-labelledby="modalTitle"><div class="folio-top"><div><span class="eyebrow">回潮 · 灯下手记</span><h2 id="modalTitle"></h2></div><button id="closeFolio" class="close-folio" aria-label="关闭手记">×</button></div><div id="modalBody" class="folio-body"></div></dialog><div id="notice" class="notice" role="status" hidden></div><script>/* 原创虚构故事。栖水镇及“回门灯”仪俗均为虚构。 */
globalThis.HUICHAO_STORY = {
  title: '回潮',
  subtitle: '第八封信',
  tagline: '天亮以前，把名字还给渡口。',
  intro: [
    '苏晚留下的采访目录里，有一段一直未归档的渡口录音。七下钟声以后，一个女人说：“前七封都没有回音。这一封，请你带到岸上。”',
    '信封隔天出现在你的门缝里。邮戳是二十三年前，收信人却写着你的名字。里面只有一张船票，终点：栖水。',
    '末班渡船把你送进一座准备迎神的小镇。家家挂着白底红字的灯，所有门牌都比街道高出一截。卖茶的老人说，今晚水会认路，人要记得自己的名字。'
  ],
  chapters: [
    {id: 1, title: '渡口没有末班船', time: '戌时 · 水线下第一盏灯', goal: '找齐三张广播刻度记录，调通旧收音机。', intro: ['船走以后，水面仍留着四道坐过人的凹痕。镇上的广播只念门牌，不念姓名。', '你决定先查清那封信从哪里寄来。'], requires: ['pier_frequency', 'street_frequency', 'paper_frequency'], puzzle: 'radio', unlockRooms: ['pier', 'street', 'paper']},
    {id: 2, title: '唱给空座的人', time: '亥时 · 第二遍回门', goal: '拼合影戏的撤离方向，寻找被遮住的旧水路。', intro: ['二排、七格、第一封。广播指向高台老宅的一只旧柜；纸铺保存的目录列着七封退回信，以及没有写完的第八封。', '目录摘要不是求神保佑。有人在洪水到来前，反复请求疏通旧渠。戏台的鼓点开始催你过桥。'], requires: ['shadow_rule', 'north_plan', 'projection_note', 'flood_register'], puzzle: 'shadow', unlockRooms: ['stage', 'clinic', 'shrine']},
    {id: 3, title: '让水走过旧路', time: '子时 · 潮头越过门槛', goal: '核对旧渠、入街口和外湾口，排出档案室积水。', intro: ['影子拼成了一条撤离路：戏台、诊所、老宅高台。它和镇志写的“全镇无人滞留”对不上。', '雨从屋檐倒着落回天空。有人在闸台上敲了三下，像是在等下一班接手的人。'], requires: ['water_route', 'gate_warning', 'gate_account', 'gate_access'], puzzle: 'water', unlockRooms: ['sluice', 'oldhome']},
    {id: 4, title: '请按姓名上船', time: '丑时 · 天光尚未到岸', goal: '把四件遗物归还给四个名字，为第八封信选择去处。', intro: ['积水退去，密封档案浮出了墙脚。每个“镇水神”的背后，原来都是一张被涂去姓名的救援登记。', '你把清晰的档案送回各处，请还记得的人一起核对。纸上的字需要活人的声音，才能重新站稳。'], requires: ['name_ferry', 'name_midwife', 'name_projectionist', 'name_keeper', 'signed_testimony'], puzzle: 'names', unlockRooms: []}
  ],
  rooms: {
    pier: {
      name: '无名渡口', subtitle: '回水湾 · 岸上的第一处脚印', chapter: 1,
      description: '低矮的渡棚朝向黑水。缆绳潮湿，船册却放在一只缠了三圈油布的木匣里。',
      echoDescription: '水面比岸高出一尺。船上的人影全部向内侧挪了挪，给一个尚未上船的人留出位置。',
      entry: ['摆渡人没有收你的票，只把一枚绳结推到桌边。“回去的时候再付。先看看，票上有没有名字。”'],
      echoEntry: ['你听见竹篙碰到石阶的声音。每响一下，岸上的湿脚印就少一双。'],
      hotspots: [
        {id: 'pier_channel', label: '渡棚广播牌', x: 81, y: 49, layer: 'normal', text: ['锈牌上的“防汛临时频段”被小心擦亮：渡口，刻度七十二。背面写着“先听水，再听街，最后听灯”。'], clue: 'pier_frequency'},
        {id: 'pier_rope', label: '摆渡人的绳结', x: 53, y: 68, layer: 'normal', text: ['老人把绳结放在掌心：“一长、两短，摸一下就知道哪头拴着船。那年停电，我们就靠这个互相认。”', '你问他的名字。他望着水，过了一会儿才说：“我替人看船。”'], clue: 'ferry_knot'},
        {id: 'pier_whistle', label: '水上的第四声哨', x: 69, y: 36, layer: 'echo', text: ['三声短哨从船上传来，第四声却在诊所方向。一个人影回头，又把已经解开的缆绳系住了。'], clue: 'echo_whistle'},
        {id: 'pier_mooring', label: '系船栓', x: 69, y: 67, layer: 'normal', text: ['旧栓旁边新添了两只扶手，高度一上一下。很久以后，这个渡口才学会让走得慢的人也能从容上船。']},
        {id: 'pier_name', label: '油布船册', x: 77, y: 80, layer: 'normal', minChapter: 4, requires: ['dry_archive'], text: ['你把排水后找到的调度副页压在船册旁。两处相同的绳结画记，连起了一条完整记录。', '罗启明，摆渡员。诊所病人送抵高台后，他再次出船接应戏台和闸台的留守者；救援绳随遗物交存。他不是“渡水将军”。'], clue: 'name_ferry'},
        {id: 'pier_waterline', label: '渡棚水痕', x: 13, y: 63, layer: 'both', text: ['三道水痕横过门柱。最高那道下面，有人用铅笔补了两个字：“到此。”雨洗掉了下半句。']}
      ]
    },
    street: {
      name: '灯笼长街', subtitle: '栖水旧街 · 灯有归处，人有门牌', chapter: 1,
      description: '灯笼照着一条略向河岸倾斜的街。茶摊只摆四只杯子，第五张凳子一直空着。',
      echoDescription: '每扇门里都有人问“回来了吗”。街上那支缓慢的队伍没有脚步声，灯光却被逐盏挡住。',
      entry: ['卖茶的梅姨用碟子扣住空杯。“你身上有纸铺的味道。先喝口热的，问话不急这一会儿。”'],
      echoEntry: ['同一句招呼从街头传到街尾，到最后一家时，变成了轻轻的点名。'],
      hotspots: [
        {id: 'street_channel', label: '喇叭下的检修单', x: 78, y: 47, layer: 'normal', text: ['检修单用透明胶贴了四层。“街报：八十八。旧机刻度偏低，请以本单为准。”这张纸比旁边的迎神告示新得多。'], clue: 'street_frequency'},
        {id: 'street_tea', label: '和梅姨说话', x: 28, y: 72, layer: 'normal', text: ['梅姨记得那年有人挨家敲门，镇志却只写“水患已平”。', '“后来大家忙着重新过日子，谁先开口都像揭别人伤口。再后来，我们连名字都不敢在饭桌上提。”'], clue: 'silent_street'},
        {id: 'street_sign', label: '抬高的门牌', x: 41, y: 61, layer: 'both', text: ['门牌挪高了，钉孔却留在原处。你按街道坡度连起旧钉孔，发现它们恰好是一条水位线。']},
        {id: 'street_lantern', label: '回门灯', x: 87, y: 28, layer: 'normal', text: ['白纸上只写门牌，红绳绕两圈，再留一个不打结的线头。梅姨说，这是栖水自己传下来的“留门”办法：让归来的人有地方认。']},
        {id: 'street_queue', label: '没有脚步的队伍', x: 53, y: 84, layer: 'echo', text: ['一把空伞停在诊所门口。伞下的声音不是唱词：“先把能走的送上去。我们等下一趟。”'], clue: 'echo_queue'},
        {id: 'street_signature', label: '梅姨的口述签名', x: 19, y: 75, layer: 'normal', minChapter: 4, requires: ['dry_archive'], text: ['你把四份登记摆到茶桌上。梅姨逐字核对，划掉一处你认错的日期，在末尾写下自己的名字。', '“我记得的就签。我没亲眼见过的，你也别替我写。还有，给我留一份。”'], clue: 'signed_testimony'}
      ]
    },
    paper: {
      name: '折灯纸铺', subtitle: '旧街尽头 · 第八只抽屉', chapter: 1,
      description: '纸屋、纸船、纸桥摆得像一座缩小的镇子。柜台下的旧收音机断断续续地发出雨声。',
      echoDescription: '纸街上的小窗依次亮起来。有一间房始终没有灯，门外却放着四双湿鞋。',
      entry: ['铺主阿禾把刀锋转向自己，再把剪好的纸递给你。“他们都说我做的是神像。可我师父留的底稿，画的明明是人。”'],
      echoEntry: ['纸桥上多了一只很小的信封。你眨眼以后，它仍在那里，边缘慢慢洇出潮痕。'],
      hotspots: [
        {id: 'paper_channel', label: '八音盒里的刻度签', x: 47, y: 67, layer: 'normal', text: ['八音盒已经不发声，盖内夹着一张广播签：“回门灯，刻度一百零四；等前两段播完，再听这一段。”'], clue: 'paper_frequency'},
        {id: 'paper_carbon', label: '借一张拓印纸', x: 40, y: 65, layer: 'normal', text: ['阿禾递给你一叠薄纸和一小块炭。“碑上凹下去的字，侧着擦。别用水，有些名字经不起再洗一遍。”'], item: 'rubbing_paper'},
        {id: 'paper_debt', label: '改过的制灯账', x: 70, y: 66, layer: 'normal', text: ['最早的账目写“周家、罗家、沈家、许家，各一盏”。后来四行都改成“镇水神位”。改字用的墨，比原账深。'], clue: 'paper_ledger'},
        {id: 'paper_letter', label: '没有收件人的信', x: 43, y: 29, layer: 'echo', text: ['纸上的声音像在喘气：“第八封不寄给县里。寄给能把他们写进故事的人。”', '你记录下这句话，也标注：来源无法确认，不能单凭它下结论。'], clue: 'eighth_letter'},
        {id: 'paper_model', label: '纸街上的空屋', x: 79, y: 46, layer: 'both', text: ['纸屋窗边画着一架放映机。四扇小门都朝高处开，模型做得很旧，方向却比今天的旅游地图准确。']},
        {id: 'paper_empty', label: '尚未落款的灯', x: 83, y: 65, layer: 'normal', minChapter: 4, text: ['阿禾摊开四张新的灯面：“这回写名字，还是仍写门牌？”', '她没有催你。墨已经磨好，可以等到天亮。']}
      ]
    },
    stage: {
      name: '倒影戏台', subtitle: '半池戏台 · 无人坐满的四排凳', chapter: 2,
      description: '幕布背面挂着三片木影：日、舟、门。转轴已经干涩，台下的池水倒映着另一场戏。',
      echoDescription: '台下坐满穿雨衣的人。台上没有神像，只有一束晃动的白光，反复指向后街。',
      entry: ['看台老人说：“旧戏不唱神怎么来，唱人怎么走。后来改了词，好多人就看不懂了。”'],
      echoEntry: ['锣鼓忽然停住。幕后的女人喊：“别看台上，看灯照的那条路！”'],
      hotspots: [
        {id: 'stage_rule', label: '旧节目单', x: 23, y: 64, layer: 'normal', text: ['背面写着木影的复位口令：“日缺朝台底，舟缺朝屋梁，门缺朝旧堤。”', '木片缺口能朝上、右、下、左四个方向，刻度依次是零、一、二、三。还需要确认旧堤在哪一侧。'], clue: 'shadow_rule'},
        {id: 'stage_handle', label: '幕边摇柄', x: 80, y: 65, layer: 'normal', text: ['摇柄被布带系在台柱上。圆轴少了一齿，恰好和幕后的机关轴吻合。'], item: 'theater_handle'},
        {id: 'stage_film', label: '缺角的胶片盒', x: 74, y: 75, layer: 'normal', minChapter: 4, requires: ['dry_archive'], text: ['保管清单写明：沈砚秋，镇放映员。她用放映灯照亮高台撤离路，确认街上人群离开后，才乘罗启明的船撤离。', '胶片的一个角被剪去，方便停电时摸认正反。这是她的工作习惯，不是祭器上的符号。'], clue: 'name_projectionist'},
        {id: 'stage_echo', label: '幕后的白光', x: 50, y: 51, layer: 'echo', text: ['你以为是一轮月亮，走近才听见胶片转动。白光落在三块路牌上，有人用手挡住镜头，给后面的人做一个“慢”的手势。'], clue: 'echo_stage'},
        {id: 'stage_axis', label: '修复幕布转轴', x: 76, y: 52, layer: 'normal', useItem: 'theater_handle', text: ['空转轴需要一只缺齿摇柄。'], usedText: ['摇柄严丝合缝地卡住转轴。褪色幕布升起，露出一条注记：“缺口指方向；不要按画中人物的朝向转。”', '三片木影现在可以分别旋转。'], clue: 'projection_note'},
        {id: 'stage_seats', label: '戏台吊架', x: 50, y: 33, layer: 'both', text: ['吊架背面刻着历年修补者的名字。有木工、放映员，也有来帮忙的街坊。这里先是大家的戏台，然后才被称为神来的地方。']}
      ]

    clinic: {

 function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageError=false;}catch{storageError=true;}const node=$('#saveStatus');if(node)node.textContent=storageError?'存储未成功 · 可导出':'已记入本地手记';}
 function toast(text){clearTimeout(toastTimer);$('#notice').textContent=text;$('#notice').hidden=false;toastTimer=setTimeout(()=>$('#notice').hidden=true,3600);}
 const focusable='button,a[href],input,select,textarea,[tabindex]';
 function focusCandidates(){return [...$('#root').querySelectorAll(focusable)].filter(node=>!node.disabled&&!node.hidden);}
 function focusMatches(node,mark){return node.tagName===mark.tag&&Object.entries(mark.data).every(([key,value])=>node.dataset[key]===value)&&(!mark.name||node.getAttribute('name')===mark.name)&&(!mark.form||node.closest('form')?.id===mark.form);}
 function rememberFocus(){
  const node=document.activeElement;if(!node||!$('#root').contains(node))return null;
  const mark={node,id:node.id,tag:node.tagName,data:{...node.dataset},name:node.getAttribute('name'),form:node.closest('form')?.id,classes:[...node.classList].filter(name=>!['active','seen','on','gate-open'].includes(name))};
  const matches=focusCandidates().filter(candidate=>focusMatches(candidate,mark)&&mark.classes.every(name=>candidate.classList.contains(name)));
  mark.index=matches.indexOf(node);return mark;
 }
 function restoreFocus(mark){
  if(!mark||$('#folio').open)return;
  const candidates=focusCandidates();let target=mark.node?.isConnected&&$('#root').contains(mark.node)?mark.node:null;
  if(!target&&mark.id)target=candidates.find(node=>node.id===mark.id);
  if(!target&&(Object.keys(mark.data).length||mark.name||mark.form)){
   const matches=candidates.filter(node=>focusMatches(node,mark)),samePlace=matches.filter(node=>mark.classes.every(name=>node.classList.contains(name)));
   target=samePlace[Math.max(0,mark.index)]||samePlace[0]||matches[0];
  }
  if(!target)target=cover?candidates.find(node=>['continue','start'].includes(node.dataset.command)):state.ending?candidates.find(node=>node.dataset.command==='export-report'):state.view==='puzzles'?candidates.find(node=>node.dataset.puzzle===activePuzzle):null;
  if(!target)target=candidates.find(node=>node.dataset.view===state.view)||candidates[0];
  target?.focus({preventScroll:true});
 }
 function openModal(title,body,wide=false){const dialog=$('#folio'),wasOpen=dialog.open;if(!wasOpen)lastFocus=rememberFocus();$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;dialog.classList.toggle('wide',wide);if(!wasOpen)dialog.showModal();else if(!dialog.contains(document.activeElement))$('#closeFolio').focus({preventScroll:true});}
 function closeModal(){if($('#folio').open)$('#folio').close();}
 function report(result,title='灯下所见'){
  if(!result.ok){toast(result.message);return;}
  save();render();
  if(result.text?.length)openModal(result.title||title,`<div class="narrative">${lines(result.text)}</div>${(result.clues||[]).map(id=>`<div class="discovery"><span>收录 · ${esc(D.clues[id].kind)}</span><strong>${esc(D.clues[id].title)}</strong></div>`).join('')}${(result.items||[]).map(id=>`<div class="discovery"><span>随身物件</span><strong>${esc(D.items[id].name)}</strong><p>${esc(D.items[id].description)}</p></div>`).join('')}`);
  if(result.clues?.length||result.items?.length)sound.cue('clue');
 }
 function chapter(){return D.chapters[state.chapter-1];}
 function pending(room,echo){const shadowState={...state,room,echo};return D.rooms[room].hotspots.filter(h=>G.available(shadowState,h)&&!state.seen.includes(h.id)).length;}
 function remaining(room){return D.rooms[room].hotspots.filter(h=>!state.seen.includes(h.id)&&(G.available({...state,room,echo:false},h)||G.available({...state,room,echo:true},h))).length;}
 function scenePoints(hotspots){
  const groups=[];
  hotspots.forEach((h,i)=>{const neighbors=groups.filter(group=>group.items.some(other=>Math.abs(h.x-other.x)<10&&Math.abs(h.y-other.y)<14));if(!neighbors.length)groups.push({items:[h],number:i+1});else{const first=neighbors[0];first.items.push(h);for(const other of neighbors.slice(1)){first.items.push(...other.items);groups.splice(groups.indexOf(other),1);}}});
  return groups.map(group=>{const h=group.items[0],seen=group.items.every(h=>state.seen.includes(h.id)),count=group.items.length,x=group.items.reduce((sum,h)=>sum+h.x,0)/count,y=group.items.reduce((sum,h)=>sum+h.y,0)/count,label=count>1?`此处${count}项调查`:h.label;return `<button class="world-point ${seen?'seen':''}" style="left:${x}%;top:${y}%" ${count>1?`data-inspections="${group.items.map(h=>h.id).join(',')}"`:`data-inspect="${h.id}"`} aria-label="${esc(label)}"><span>${seen?'✓':String(group.number).padStart(2,'0')}</span>${count>1?`<em>${count}</em>`:''}<b>${esc(label)}</b></button>`;}).join('');
 }
 function header(){return `<header class="mast"><a class="wordmark" href="#" data-command="cover"><span class="brand-seal">潮</span><span>回 潮<small>THE EIGHTH LETTER</small></span></a><div class="mast-actions"><span class="save-status" id="saveStatus">${storageError?'存储未成功 · 可导出':'本地调查手记'}</span><button class="icon-button" data-command="audio" aria-pressed="${state.audio}">${state.audio?'声开':'声关'}</button><button class="icon-button" data-command="settings">行囊 / 存档</button></div></header>`;}
 function render(){
  const focus=rememberFocus();
  document.body.classList.toggle('echo',state.echo&&!cover);document.body.classList.toggle('gentle',state.gentle);document.body.classList.toggle('at-cover',cover);
  $('#root').innerHTML=header()+(cover?coverView():state.ending?endingView():gameView());
  if(!cover&&state.view==='journal'){$('#journalSearch').value=journalSearch;$('#journalFilter').value=journalFilter;}
  restoreFocus(focus);
 }
 function coverView(){return `<main class="cover"><div class="cover-art">${huichaoCover()}</div><div class="cover-shade"></div><section class="cover-copy"><div class="eyebrow">第七个预言 · 独立续篇</div><div class="cover-edition"><span>志怪调查</span><span>档案 · 捌</span></div><h1>回<span>潮</span></h1><div class="cover-subtitle">第 八 封 信</div><div class="cover-rule"></div><p class="cover-quote">${esc(D.tagline)}</p><p class="cover-description">一座被水抹去的镇子。<br>一场没有送到岸上的回门。<br>这一次，请把他们的名字带回来。</p><div class="cover-actions"><button class="primary" data-command="${state.started?'continue':'start'}">${state.started?'提灯，继续走':'拆开第八封信'}<span>↗</span></button>${state.started?'<button class="quiet" data-command="new">从渡口重新开始</button>':''}</div><div class="cover-details"><span>四更长夜</span><i></i><span>八处旧地</span><i></i><span>三种归途</span></div><p class="content-note">民俗悬疑 · 环境异象 · 无突发惊吓<br>声音默认关闭，全部线索均可阅读。地方与仪俗均为虚构。</p><button class="text-button" data-command="help">初次掌灯须知 →</button></section><div class="cover-corner"><span>栖水镇</span><small>灯照生人，水记旧事</small></div></main>`;}
 function gameView(){const c=chapter();return `<main class="game-shell"><div class="chapter-bar"><div><span class="eyebrow">${esc(c.time)} · 第${['一','二','三','四'][state.chapter-1]}更</span><h1>${esc(c.title)}</h1></div><div class="chapter-track" aria-label="当前第${state.chapter}章，共4章">${D.chapters.map(ch=>`<span class="${ch.id<=state.chapter?'lit':''}"><i></i><small>${ch.id===state.chapter?'此刻':ch.id<state.chapter?'已过':'未至'}</small></span>`).join('')}</div></div><nav class="view-nav" aria-label="调查工具">${Object.entries(views).map(([id,label])=>`<button data-view="${id}" class="${state.view===id?'active':''}" aria-current="${state.view===id?'page':'false'}"><span aria-hidden="true">${icons[id]}</span>${label}</button>`).join('')}</nav><div class="play-layout"><section class="main-pane">${({scene:sceneView,journal:journalView,map:mapView,puzzles:puzzlesView})[state.view]()}</section><aside class="sidebar">${sidebar()}</aside></div></main>`;}
 function sceneView(){const room=D.rooms[state.room],hotspots=room.hotspots.filter(h=>G.available(state,h));return `<div class="location-heading"><div><span class="eyebrow">${esc(room.subtitle)}</span><h2>${esc(room.name)}</h2></div><button class="lens-toggle ${state.echo?'on':''}" data-command="light" aria-pressed="${state.echo}"><span class="lamp-icon" aria-hidden="true">◉</span>${state.echo?'收灯 · 回到明景':'提灯 · 照见旧影'}<small>L</small></button></div><div class="world-stage ${state.echo?'is-echo':''}">${huichaoArt(state.room,state.echo)}<div class="world-vignette"></div><div class="world-layer"><span class="layer-light"></span>${state.echo?'灯照 · 旧影':'眼前 · 明景'}</div>${scenePoints(hotspots)}<span class="world-location">${esc(room.name)}<small>${state.echo?'有些事，只有灯记得':'雨还没有停'}</small></span></div><div class="scene-prose"><span aria-hidden="true">${state.echo?'影':'见'}</span><p>${esc(state.echo?room.echoDescription:room.description)}</p></div><div class="investigation-header"><h3>停步细看</h3><span>明景 ${pending(state.room,false)} · 旧影 ${pending(state.room,true)} 处待看</span></div><div class="investigation-grid">${hotspots.map((h,i)=>`<button class="inspect-card ${state.seen.includes(h.id)?'seen':''}" data-inspect="${h.id}"><span>${state.seen.includes(h.id)?'✓':String(i+1).padStart(2,'0')}</span><div>${esc(h.label)}<small>${h.useItem&&!state.items.includes(h.useItem)?'需要 '+esc(D.items[h.useItem].name):state.seen.includes(h.id)?'已查看 · 再读一遍':h.layer==='echo'?'只在灯下显现':'观察与交谈'}</small></div><b>↗</b></button>`).join('')||'<div class="empty">这里的旧影暂时沉默着。试试收灯，或沿路去别处。</div>'}</div><div class="nearby-heading"><span>沿着水声走</span><button class="text-button" data-view="map">展开行路图 →</button></div><nav class="room-strip" aria-label="前往场所">${Object.entries(D.rooms).filter(([id])=>G.roomOpen(state,id)).map(([id,r])=>`<button data-room="${id}" class="${state.room===id?'active':''}">${esc(r.name)}<small>${id===state.room?'所在之处':remaining(id)?'还有细节':'暂已看过'}</small></button>`).join('')}</nav>`;}
 function sidebar(){const tasks=G.objective(state),current=chapter();return `<section class="objective-panel"><span class="eyebrow">此更 · 未竟之事</span><h3>${esc(current.goal)}</h3><div class="objective-list">${tasks.map(t=>`<button data-command="${t.type==='puzzle'?'puzzle':'lead'}" data-id="${t.id}"><i>○</i><span>${esc(t.text)}</span><b>↗</b></button>`).join('')||'<p class="all-done">这一更的线索已接上。<br>远处传来了钟声。</p>'}</div>${tasks.length===0?(state.chapter<4?'<button class="primary full" data-command="advance">等下一次钟声 →</button>':'<button class="primary full" data-command="decision">走向最后的渡口 →</button>'):''}</section><section class="lantern-panel"><div class="small-lantern" aria-hidden="true"><i></i><b>照</b></div><div><span class="eyebrow">随身 · 显影纸灯</span><p>同一处地方，<br>灯前灯后会留下不同线索。</p><button class="text-button" data-command="help">掌灯须知 ↗</button></div></section><section class="bag-panel"><div class="section-label"><span>随身物件</span><b>${String(state.items.length).padStart(2,'0')}</b></div>${state.items.map(id=>`<button class="bag-item" data-item="${id}"><span>◇</span>${esc(D.items[id].name)}</button>`).join('')||'<p class="muted small">纸灯之外，行囊还是空的。</p>'}</section><section class="recent-panel"><div class="section-label"><span>新入手记</span><b>${String(state.clues.length).padStart(2,'0')}</b></div>${state.clues.slice(-3).reverse().map(id=>`<button data-clue="${id}"><small>${esc(D.clues[id].kind)}</small><span>${esc(D.clues[id].title)}</span></button>`).join('')||'<p class="muted small">观察场景，名字与物证会在这里留下。</p>'}<button class="text-button" data-view="journal">翻开全部手记 →</button></section>`;}
 const mapPoints={pier:[19,79],street:[35,58],paper:[18,28],stage:[51,25],clinic:[56,59],shrine:[79,24],sluice:[86,57],oldhome:[75,84]};
 function mapView(){return `<div class="page-heading"><span class="eyebrow">栖水镇 · 行路图</span><h2>水退过的地方</h2><p>亮起的地名可以抵达。切换灯照不会消耗物件。</p></div><div class="town-map"><svg viewBox="0 0 1000 670" aria-hidden="true"><defs><pattern id="map-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#9b9e8322"/></pattern></defs><rect width="1000" height="670" fill="url(#map-grid)"/><path d="M0 500Q150 560 280 442T555 420T790 520T1000 438" stroke="#547e7a" stroke-width="75" fill="none" opacity=".18"/><path d="M0 500Q150 560 280 442T555 420T790 520T1000 438" stroke="#779b91" stroke-width="1" fill="none" opacity=".4"/><path d="M190 529L350 389 180 188M350 389L510 168 790 161 860 382 750 563M350 389L560 395 510 168M560 395L860 382" stroke="#bdb292" stroke-width="2" stroke-dasharray="5 7" opacity=".45" fill="none"/><text x="440" y="516" fill="#8caaa0" font-size="21" letter-spacing="17" transform="rotate(-8 440 516)">回潮河</text></svg>${Object.entries(D.rooms).map(([id,r])=>`<button class="map-stop ${G.roomOpen(state,id)?'open':'locked'} ${id===state.room?'current':''}" style="left:${mapPoints[id][0]}%;top:${mapPoints[id][1]}%" data-room="${id}" ${G.roomOpen(state,id)?'':`disabled`}><i></i><span>${esc(r.name)}</span><small>${!G.roomOpen(state,id)?'第'+r.chapter+'更':id===state.room?'你在这里':remaining(id)+' 处待看'}</small></button>`).join('')}</div><p class="map-footnote">地图指向能够抵达的地点。屋里的旧事，需要你亲自提灯去看。</p>`;}
 function journalView(){const found=state.clues.slice().reverse().filter(id=>(journalFilter==='all'||D.clues[id].kind===journalFilter)&&(!journalSearch||(D.clues[id].title+D.clues[id].body+D.clues[id].source).includes(journalSearch)));return `<div class="page-heading"><span class="eyebrow">掌灯人的手记</span><h2>让证据留下来</h2><p>已经看见的事不会因收灯消失。点开记录可重读原文。</p></div><div class="journal-tools"><input id="journalSearch" aria-label="搜索手记" placeholder="查找名字、物件或地点…" maxlength="100"><select id="journalFilter" aria-label="筛选手记"><option value="all">全部记录</option>${['物证','记录','证言','异象'].map(k=>`<option>${k}</option>`).join('')}</select><span>${found.length} 页</span></div><div class="journal-grid">${found.map(id=>`<button class="clue-card" data-clue="${id}"><div><span class="clue-kind">${esc(D.clues[id].kind)}</span><small>${String(Object.keys(D.clues).indexOf(id)+1).padStart(2,'0')}</small></div><h3>${esc(D.clues[id].title)}</h3><p>${esc(D.clues[id].body)}</p><footer>${esc(D.clues[id].source)}<span>↗</span></footer></button>`).join('')||'<div class="empty">没有找到对应记录。回到镇里，看看尚未调查的地方。</div>'}</div><section class="personal-notes"><label for="personalNotes">留给自己的话</label><textarea id="personalNotes" maxlength="12000" placeholder="记下还没有接上的名字与细节……">${esc(state.notes)}</textarea><small>随调查进度保存在本地，可一并导出。</small></section>`;}
 function clueReference(ids){return `<div class="reference-list">${(ids||[]).map(id=>`<button data-clue="${id}" ${state.clues.includes(id)?'':'disabled'}><span>${state.clues.includes(id)?'✓':'○'}</span>${esc(state.clues.includes(id)?D.clues[id].title:D.clues[id].source)}<small>${state.clues.includes(id)?'重读':'尚未找到'}</small></button>`).join('')}</div>`;}
 function puzzlesView(){if(!D.puzzles[activePuzzle])activePuzzle=chapter().puzzle;const p=D.puzzles[activePuzzle],ch=D.chapters.find(c=>c.puzzle===activePuzzle),ready=G.puzzleAvailable(state,activePuzzle),solved=state.solved.includes(activePuzzle);return `<div class="page-heading"><span class="eyebrow">灯下 · 解旧事</span><h2>把零落的事接起来</h2></div><nav class="puzzle-tabs" aria-label="选择谜题">${D.chapters.map(c=>`<button data-puzzle="${c.puzzle}" class="${c.puzzle===activePuzzle?'active':''}" ${c.id>state.chapter?'disabled':''}><small>${String(c.id).padStart(2,'0')}</small>${esc(D.puzzles[c.puzzle].title)}${state.solved.includes(c.puzzle)?'<b>✓</b>':''}</button>`).join('')}</nav><section class="puzzle-panel"><div class="puzzle-heading"><span class="eyebrow">第${ch.id}更 · ${solved?'已经解开':'尚待核验'}</span><h3>${esc(p.title)}</h3>${lines(p.intro)}</div>${clueReference(p.requires)}${!ready?'<div class="puzzle-locked"><span>◌</span><p>先找到上方列出的依据。<br>回到现场，明景和旧影都值得看看。</p><button data-view="map">沿行路图去找 →</button></div>':solved?`<div class="puzzle-solved"><span>已解</span>${lines(p.success)}${state.chapter===4&&activePuzzle==='names'&&!G.objective(state).length?'<button class="primary" data-command="decision">走向最后的渡口 →</button>':''}</div>`:({radio:radioPuzzle,shadow:shadowPuzzle,water:waterPuzzle,names:namesPuzzle})[activePuzzle]()}${ready&&!solved?`<div class="hint-line"><button class="text-button" data-command="hint" data-id="${activePuzzle}">灯下求一个提示 ${state.hints[activePuzzle]||0}/3</button><p role="status">${state.hints[activePuzzle]?esc(p.hint[state.hints[activePuzzle]-1]):'没有倒计时，也不会因试错失去物件。'}</p></div>`:''}</section>`;}
 function radioPuzzle(){const p=D.puzzles.radio;return `<div class="radio-device"><div class="radio-speaker" aria-hidden="true"></div><div class="radio-face"><span class="device-label">栖水 · 旧式收音机</span><div class="frequency-display"><strong id="frequencyValue">${frequency}</strong><span>刻度</span><i></i></div><div class="frequency-controls"><button data-tune="-1" aria-label="频率减一">−</button><input id="frequency" aria-label="收音机频率刻度" type="range" min="60" max="120" step="1" value="${frequency}"><button data-tune="1" aria-label="频率加一">＋</button></div><div class="dial-scale"><span>60</span><span>80</span><span>100</span><span>120</span></div><button class="listen-button" data-command="listen">停下来，收听这一刻度</button></div></div><div class="radio-status" id="radioStatus" role="status">依据手记调准刻度，收听后会留下完整文字。</div><div class="received-signals">${p.frequencies.map((f,i)=>`<button data-signal="${i}" ${state.radioHeard.includes(f)?'':'disabled'}><span>第${i+1}段</span><strong>${state.radioHeard.includes(f)?'已收录 ↗':'尚未接通'}</strong></button>`).join('')}</div><form id="radioForm" class="answer-form"><label for="radioCode">按刻度由低到高，拼出三位档案编号</label><div><input id="radioCode" name="code" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" placeholder="— — —" required autocomplete="off"><button class="primary" type="submit">核对档案编号 →</button></div></form>`;}
 function shadowPuzzle(){const p=D.puzzles.shadow;return `<div class="shadow-theatre"><div class="shadow-screen"><svg viewBox="0 0 660 330" aria-hidden="true"><defs><radialGradient id="shadow-glow"><stop stop-color="#ead9aa"/><stop offset="1" stop-color="#928266"/></radialGradient></defs><rect x="10" y="10" width="640" height="310" rx="3" fill="url(#shadow-glow)"/><path d="M25 25h610v280H25z" fill="none" stroke="#65533f"/><g id="shadowShapes">${shadowShapes()}</g><path d="M15 285Q150 270 270 290T650 276" fill="none" stroke="#6b7764" stroke-width="3" opacity=".6"/></svg><span>转动木片，让残缺的旧影归位</span></div></div><div class="shadow-controls">${[0,1,2].map((_,i)=>`<div><span>${esc(p.pieces?.[i]?.name||['日轮','渡舟','水门'][i])}</span><button data-rotate="${i}" aria-label="旋转第${i+1}片木片"><b id="shadowValue${i}">${['向上','向右','向下','向左'][shadow[i]]}</b><span>旋转 90° ↻</span></button></div>`).join('')}</div><p class="puzzle-note">每片木片的缺口指向与按钮方向一致。对照节目单与祠中的镇图，再按下映影。</p><button class="primary full" data-command="solve-shadow">映影，核对这一幕 →</button>`;}
 function shadowShapes(){return shadow.map((angle,i)=>`<g transform="translate(${130+i*200} 158) rotate(${angle*90})"><circle r="64" fill="#2c3028" opacity=".92"/><path d="M-13-70h26v33h-26z" fill="#dcc89c"/>${i===0?'<circle r="31" fill="none" stroke="#a8936b" stroke-width="5"/>':i===1?'<path d="M-41 10h82l-14 22h-52z M0-30v37m-23-34L0-36 24-27" fill="none" stroke="#ad9d7d" stroke-width="5"/>':'<path d="M-28 35v-66h56v66m-52-52h48M0-28v62" fill="none" stroke="#ad9d7d" stroke-width="5"/>'}</g>`).join('');}
 function waterPuzzle(){const p=D.puzzles.water;return `<div class="water-board"><svg viewBox="0 0 760 360" aria-hidden="true"><path d="M50 160h160l140-85h140l190 0 M210 160l140 65h135l195 25 M490 75v175" fill="none" stroke="#50625d" stroke-width="32"/><path d="M50 160h160" fill="none" stroke="#91b2a4" stroke-width="15"/><g id="waterFlow">${waterFlow()}</g><path d="M30 126h65v65H30z M641 36h94v75h-94z M631 205h103v77H631z" fill="#222d29" stroke="#9caa8b"/><text x="62" y="162" text-anchor="middle" fill="#e4d7b3" font-size="18">档案室</text><text x="688" y="79" text-anchor="middle" fill="#e4d7b3" font-size="18">外湾</text><text x="682" y="250" text-anchor="middle" fill="#e4d7b3" font-size="18">老街</text><text x="360" y="336" text-anchor="middle" fill="#a0aaa0" font-size="14">先让水有去处，再替人留归路</text></svg></div><div class="gate-controls">${[0,1,2].map((_,i)=>`<button data-gate="${i}" class="${gates[i]?'gate-open':''}" aria-pressed="${gates[i]}"><span>${esc(p.gates?.[i]?.name||['旧渠闸','入街闸','外湾闸'][i])}</span><b id="gateValue${i}">${gates[i]?'开启':'关闭'}</b><small>点击${gates[i]?'关闭':'开启'}</small></button>`).join('')}</div><button class="primary full" data-command="solve-water">确认闸位，排出积水 →</button>`;}
 function waterFlow(){return `<path d="M210 160l140-85h140" fill="none" stroke="${gates[0]?'#94c3ad':'#394d46'}" stroke-width="15"/><path d="M210 160l140 65h135l195 25" fill="none" stroke="${gates[1]?'#b97a65':'#394d46'}" stroke-width="15"/><path d="M490 75h190" fill="none" stroke="${gates[0]&&gates[2]?'#94c3ad':'#394d46'}" stroke-width="15"/>${[[305,103],[360,225],[568,75]].map(([x,y],i)=>`<g transform="translate(${x} ${y})"><rect x="-19" y="-29" width="38" height="58" rx="3" fill="#332d25" stroke="${gates[i]?'#d4bb82':'#907d60'}" stroke-width="3"/><text x="0" y="6" text-anchor="middle" fill="#e1d3ad" font-size="18">${['壹','贰','叁'][i]}</text></g>`).join('')}`;}
 function namesPuzzle(){const p=D.puzzles.names;return `<form id="namesForm"><div class="name-ledger"><div class="ledger-title"><span>无名册</span><small>物件还在，名字不应再空着</small></div>${p.people.map((person,i)=>`<div class="name-row"><span class="ledger-number">${['壹','贰','叁','肆'][i]}</span><div><strong>${esc(person.token)}</strong><small>${esc(person.role)}</small><button type="button" class="text-button" data-clue="${person.clueId}">重读相应记录 ↗</button></div><label><span class="sr-only">为${esc(person.token)}的主人归还姓名</span><select name="${person.id}" required><option value="">写下姓名</option>${p.people.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).map(other=>`<option value="${esc(other.name)}">${esc(other.name)}</option>`).join('')}</select></label></div>`).join('')}</div><button class="primary full" type="submit">合上名册，请他们回家 →</button></form>`;}
 function decision(){if(G.objective(state).length){toast('还有没有写全的记录。');return;}openModal('天亮之前，选择一条归途',`<div class="narrative"><p>四个名字已经写回去。水声第一次低过了人声。</p><p>这封信交给谁，旧事怎样被记起。这一次，由你作答。</p></div><div class="ending-choices">${Object.entries(D.endings).map(([id,e],i)=>`<button data-ending="${id}"><small>归途 · ${['壹','贰','叁'][i]}</small><h3>${esc(e.choice||e.title)}</h3><p>${esc(e.choiceDescription||e.subtitle)}</p><span>作出选择 ↗</span></button>`).join('')}</div>`,true);}
 function endingView(){const end=D.endings[state.ending];return `<main class="ending-page"><div class="ending-art">${huichaoArt('pier',state.ending==='stay')}</div><section class="ending-copy"><span class="eyebrow">回潮 · 第八封信 / 已抵岸</span><span class="ending-seal">${state.ending==='remember'?'归':state.ending==='stay'?'守':'岸'}</span><h1>${esc(end.title)}</h1><p class="ending-subtitle">${esc(end.subtitle)}</p><div class="narrative">${lines(end.text)}</div><div class="ending-stats"><div><b>${state.clues.length}</b><span>页调查记录</span></div><div><b>四</b><span>个归还的姓名</span></div><div><b>${state.visited.length}</b><span>处走过的旧地</span></div></div><div class="ending-actions"><button class="primary" data-command="export-report">带走这封调查手记 ↓</button><button data-command="revisit">回到天亮前，另选归途</button><button class="quiet" data-command="cover">合上信封</button></div><p class="ending-foot">第八封信，到此封缄。<br>愿每一次被记起，都有人接住。</p></section></main>`;}
 function settings(){openModal('行囊与存档',`<section class="settings-section"><h3>灯与声音</h3><button data-command="audio" class="full">${state.audio?'关闭':'开启'}环境声音</button><label class="setting-row">音量<input id="soundVolume" type="range" min="0" max="70" value="${state.volume}"></label><label class="setting-row"><span>安静画面<small>减少流动、光晕与过场动画</small></span><input id="gentleMode" type="checkbox" ${state.gentle?'checked':''}></label><p class="muted small">全部音频都有文字线索；关闭声音仍可完整通关。</p></section><section class="settings-section"><h3>把手记带走</h3><p class="muted">进度存于此浏览器。换设备或移动文件前，可先导出一份。</p><div class="button-row"><button data-command="export-save">导出进度 ↓</button><label class="file-button">导入进度 ↑<input id="importSave" type="file" accept=".json,application/json"></label></div><p class="small muted">本作使用独立存档，不会覆盖《第七个预言》的调查。</p></section><section class="settings-section"><button class="text-button" data-command="help">查看掌灯须知 →</button><button class="text-button danger" data-command="new">重新开始本作 →</button></section>`);}
 function help(){openModal('初次掌灯须知',`<div class="narrative"><p><strong>一、同一地点，照两次。</strong><br>“明景”是眼前的镇子，“旧影”是纸灯照出的痕迹。点击场景圆点或下方调查卡片都能查看。</p><p><strong>二、先拿到依据，再解旧事。</strong><br>每更有一个主谜题。线索会收入手记，道具会在需要处自动使用，不会被消耗。错误答案可以重试。</p><p><strong>三、路会随着调查出现。</strong><br>查看右侧“未竟之事”，集齐本更线索并解开谜题，等待下一次钟声。最后归还四个姓名，再选择归途。</p><p><strong>四、不必依赖听觉或颜色。</strong><br>广播有完整文字，开闸和灯照都有明确状态。声音默认关闭，安静画面默认开启。</p><p class="muted">快捷键：L 提灯 / 收灯，J 手记，M 行路图。所有按钮均支持键盘操作，弹窗可按 Esc 关闭。</p></div>`);}
 function showClue(id){if(!state.clues.includes(id)){toast('这页记录还没有找到。');return;}const clue=D.clues[id];openModal(clue.title,`<div class="clue-sheet"><span class="eyebrow">${esc(clue.kind)} · 第${clue.chapter}更</span><div class="narrative">${lines(clue.body)}</div><footer>${esc(clue.source)}</footer></div>`);}
 function setView(view){if(!views[view])return;state.view=view;if(view==='puzzles')activePuzzle=chapter().puzzle;save();render();window.scrollTo({top:0,behavior:'instant'});}
 function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
 function exportReport(){const ending=state.ending?D.endings[state.ending]:null;download('回潮_第八封信_调查手记.txt',`${D.title}\n${ending?'归途：'+ending.title+'\n'+ending.text.join('\n'):'尚在调查中'}\n\n已记录的旧事\n\n`+state.clues.map(id=>`${D.clues[id].title}\n${D.clues[id].body}\n出处：${D.clues[id].source}`).join('\n\n')+'\n\n留给自己的话\n'+state.notes,'text/plain;charset=utf-8');toast('调查手记已准备下载。');}
 async function command(name,id){
  if(name==='start'){cover=false;report(G.start(state),'第八封信');window.scrollTo({top:0,behavior:'instant'});}
  else if(name==='continue'){cover=false;render();window.scrollTo({top:0,behavior:'instant'});}
  else if(name==='cover'){cover=true;closeModal();render();window.scrollTo({top:0,behavior:'instant'});}
  else if(name==='settings')settings();
  else if(name==='help')help();
  else if(name==='audio'){await sound.toggle();save();render();if($('#folio').open&&$('#modalTitle').textContent==='行囊与存档')settings();}
  else if(name==='light'){const result=G.toggleEcho(state);if(result.ok){save();render();sound.cue('light');toast(state.echo?'纸灯照见了这里留下的旧影。':'你收起灯，回到眼前的镇子。');}else toast(result.message);}
  else if(name==='puzzle'){closeModal();activePuzzle=id;state.view='puzzles';save();render();window.scrollTo({top:0,behavior:'instant'});}
  else if(name==='lead'){const clue=D.clues[id];const locations=Object.entries(D.rooms).filter(([,r])=>r.hotspots.some(h=>h.clue===id));openModal('去哪里寻找',`<div class="narrative"><p>待查：${esc(clue.source)}</p><p class="muted">明景里未必能看清全部；到达后也试着提灯。</p></div><div class="button-row">${locations.map(([room,r])=>`<button data-room="${room}">${esc(r.name)} →</button>`).join('')||`<button data-command="puzzle" data-id="${chapter().puzzle}">查看本更谜题 →</button>`}</div>`);}
  else if(name==='advance'){const result=G.advance(state);if(result.ok){activePuzzle=chapter().puzzle;window.scrollTo({top:0,behavior:'instant'});sound.cue('bell');}report(result,'远处的钟声');}
  else if(name==='hint'){const result=G.useHint(state,id);save();render();toast(result.message);}
  else if(name==='listen'){const result=G.listen(state,frequency);if(!result.ok){toast(result.message);return;}save();render();$('#radioStatus').innerHTML=result.signal?`<span class="signal-caught">${esc(result.message)}</span>${lines(result.text)}`:esc(result.message);if(result.signal)sound.cue('radio');}
  else if(name==='solve-shadow')report(G.solve(state,'shadow',shadow),'影戏归位');
  else if(name==='solve-water')report(G.solve(state,'water',gates),'水路已明');
  else if(name==='decision')decision();
  else if(name==='revisit'){report(G.revisitEnding(state));activePuzzle='names';render();window.scrollTo({top:0,behavior:'instant'});}
  else if(name==='export-save'){download('回潮_第八封信_进度.json',JSON.stringify({game:'huichao',version:1,state},null,2),'application/json');toast('进度文件已准备下载。');}
  else if(name==='export-report')exportReport();
  else if(name==='new')openModal('重新拆开这封信',`<div class="narrative"><p>重新开始会替换本作在此浏览器中的进度。可以先把当前手记导出留存。</p></div><div class="button-row"><button data-command="export-save">先导出当前进度</button><button class="danger" data-command="confirm-new">重新开始</button></div>`);
  else if(name==='confirm-new'){sound.stop();state=G.create();frequency=60;shadow=[0,0,0];gates=[false,false,false];cover=false;closeModal();report(G.start(state),'第八封信');}
 }
 document.addEventListener('click',e=>{
  const target=e.target.closest('button,a[data-command]');if(!target||target.disabled)return;
  if(target.dataset.command){e.preventDefault();command(target.dataset.command,target.dataset.id);}
  else if(target.dataset.view){closeModal();setView(target.dataset.view);}
  else if(target.dataset.room){const result=G.move(state,target.dataset.room);if(result.ok){closeModal();state.view='scene';save();render();window.scrollTo({top:0,behavior:'instant'});if(result.first)report(result,D.rooms[state.room].name);}else toast(result.message);}
  else if(target.dataset.inspections){const items=target.dataset.inspections.split(',').map(id=>D.rooms[state.room].hotspots.find(h=>h.id===id)).filter(h=>G.available(state,h));openModal('灯下的几处细节',`<div class="point-choices">${items.map(h=>`<button class="inspect-card ${state.seen.includes(h.id)?'seen':''}" data-inspect="${h.id}"><span>${state.seen.includes(h.id)?'✓':'○'}</span><div>${esc(h.label)}<small>${state.seen.includes(h.id)?'已经看过 · 可以重读':'走近查看'}</small></div></button>`).join('')}</div>`);}
  else if(target.dataset.inspect)report(G.inspect(state,target.dataset.inspect));
  else if(target.dataset.clue)showClue(target.dataset.clue);
  else if(target.dataset.item){const item=D.items[target.dataset.item];openModal(item.name,`<div class="narrative">${lines(item.description)}</div><p class="muted small">需要时会自动使用，不会被消耗。</p>`);}
  else if(target.dataset.puzzle){activePuzzle=target.dataset.puzzle;render();}
  else if(target.dataset.tune){frequency=Math.max(60,Math.min(120,frequency+Number(target.dataset.tune)));$('#frequency').value=frequency;$('#frequencyValue').textContent=frequency;}
  else if(target.dataset.signal){const index=Number(target.dataset.signal),segment=D.puzzles.radio.segments[index];if(state.radioHeard.includes(D.puzzles.radio.frequencies[index]))openModal(segment.label||'旧广播',`<div class="narrative">${lines(segment.text||segment.message)}</div>`);}
  else if(target.dataset.rotate!==undefined){const i=Number(target.dataset.rotate);shadow[i]=(shadow[i]+1)%4;$('#shadowShapes').innerHTML=shadowShapes();$('#shadowValue'+i).textContent=['向上','向右','向下','向左'][shadow[i]];sound.cue('click');}
  else if(target.dataset.gate!==undefined){const i=Number(target.dataset.gate);gates[i]=!gates[i];target.classList.toggle('gate-open',gates[i]);target.setAttribute('aria-pressed',String(gates[i]));target.querySelector('b').textContent=gates[i]?'开启':'关闭';target.querySelector('small').textContent='点击'+(gates[i]?'关闭':'开启');$('#waterFlow').innerHTML=waterFlow();sound.cue('click');}
  else if(target.dataset.ending){const result=G.chooseEnding(state,target.dataset.ending);if(result.ok){closeModal();save();render();window.scrollTo({top:0,behavior:'instant'});sound.cue('bell');}else toast(result.message);}
 });
 document.addEventListener('submit',e=>{if(e.target.id==='radioForm'){e.preventDefault();report(G.solve(state,'radio',new FormData(e.target).get('code')),'广播里的档案');}if(e.target.id==='namesForm'){e.preventDefault();report(G.solve(state,'names',Object.fromEntries(new FormData(e.target))),'名字归还之时');}});
 document.addEventListener('input',e=>{
  if(e.target.id==='frequency'){frequency=Number(e.target.value);$('#frequencyValue').textContent=frequency;}
  else if(e.target.id==='personalNotes'){state.notes=e.target.value;save();}
  else if(e.target.id==='soundVolume'){state.volume=Number(e.target.value);sound.volume();save();}
  else if(e.target.id==='journalSearch'){const start=e.target.selectionStart;journalSearch=e.target.value;render();$('#journalSearch').focus();$('#journalSearch').setSelectionRange(start,start);}
 });
 document.addEventListener('change',async e=>{
  if(e.target.id==='journalFilter'){journalFilter=e.target.value;render();}
  else if(e.target.id==='gentleMode'){state.gentle=e.target.checked;save();render();}
  else if(e.target.id==='importSave'){
   const file=e.target.files?.[0];if(!file)return;if(file.size>250000){toast('这份存档过大，未读取。');e.target.value='';return;}
   try{const raw=JSON.parse(await file.text());if(raw.game!=='huichao'||raw.version!==1)throw Error();const loaded=G.validateSave(raw.state);if(!loaded)throw Error();sound.stop();state=loaded;cover=!state.started;activePuzzle=chapter().puzzle;closeModal();save();render();toast('手记已接上，仍是你离开时的那条路。');}catch{toast('存档无法核验。请使用本作导出的完整进度，当前调查未改变。');e.target.value='';}
  }
 });
 document.addEventListener('keydown',e=>{if(cover||state.ending||$('#folio').open||e.repeat||e.ctrlKey||e.altKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key.toLowerCase()==='l'){e.preventDefault();command('light');}if(e.key.toLowerCase()==='j')setView('journal');if(e.key.toLowerCase()==='m')setView('map');});
 $('#closeFolio').onclick=closeModal;$('#folio').addEventListener('click',e=>{if(e.target===$('#folio')){const r=$('#folio').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});$('#folio').addEventListener('close',()=>{if($('#folio').open)return;const focus=lastFocus;lastFocus=null;restoreFocus(focus);});
 const sound={ctx:null,master:null,nodes:[],timer:null,
  async toggle(){if(state.audio){this.stop();return;}try{this.ctx=this.ctx||new(window.AudioContext||window.webkitAudioContext)();await this.ctx.resume();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);state.audio=true;this.volume();const buffer=this.ctx.createBuffer(1,this.ctx.sampleRate*4,this.ctx.sampleRate),data=buffer.getChannelData(0);let last=0;for(let i=0;i<data.length;i++){last=(last+Math.random()*.04-.02)*.97;data[i]=last;}const noise=this.ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=this.ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=420;const gain=this.ctx.createGain();gain.gain.value=.22;noise.connect(filter).connect(gain).connect(this.master);noise.start();this.nodes.push(noise);this.cue('bell');this.timer=setInterval(()=>{if(!document.hidden)this.cue('rain');},17000);toast('环境声音已开启。所有线索仍可阅读。');}catch{state.audio=false;toast('声音暂时无法开启，文字线索仍完整可用。');}},
  volume(){if(this.master&&this.ctx)this.master.gain.setTargetAtTime(state.volume/100*.38,this.ctx.currentTime,.1);},
  cue(kind){if(!state.audio||!this.ctx||this.ctx.state!=='running'||!this.master)return;const base=({clue:523.25,light:174.6,bell:220,radio:392,click:196,rain:146.8})[kind]||220;[1,1.503].forEach((ratio,i)=>{const osc=this.ctx.createOscillator(),gain=this.ctx.createGain(),now=this.ctx.currentTime;osc.type='sine';osc.frequency.value=base*ratio;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(kind==='click'?.045:.075,now+.08);gain.gain.exponentialRampToValueAtTime(.0001,now+(kind==='bell'?3:1.2));osc.connect(gain).connect(this.master);osc.start(now+i*.04);osc.stop(now+3.2);osc.onended=()=>{osc.disconnect();gain.disconnect();};});},
  stop(){state.audio=false;clearInterval(this.timer);this.nodes.forEach(n=>{try{n.stop();n.disconnect();}catch{}});this.nodes=[];if(this.master){this.master.disconnect();this.master=null;}},
 };
 document.addEventListener('visibilitychange',()=>{if(!sound.ctx||!state.audio)return;if(document.hidden)sound.ctx.suspend().catch(()=>{});else sound.ctx.resume().catch(()=>{});});
 window.addEventListener('pagehide',()=>{save();sound.stop();});
 render();
})();
</script></body></html>
